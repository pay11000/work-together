<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Together">
<title>Work Together</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1d2129; --sub:#6b7280; --line:#e6e8ec;
  --accent:#2f9e8f; --accent-soft:color-mix(in srgb, var(--accent) 14%, transparent); --danger:#d9534f; --track:#eceef1;
  --p0:#2f9e8f; --p1:#e07a5f; --p2:#6c7bd9; --p3:#c9a227;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){html:not([data-theme=light]){ --bg:#111317; --card:#1b1e24; --text:#eceef2; --sub:#9aa1ad; --line:#2a2e36;
    --accent-soft:color-mix(in srgb, var(--accent) 22%, transparent); --track:#2a2e36; --shadow:none; }}
html[data-theme=dark]{ --bg:#111317; --card:#1b1e24; --text:#eceef2; --sub:#9aa1ad; --line:#2a2e36;
    --accent-soft:color-mix(in srgb, var(--accent) 22%, transparent); --track:#2a2e36; --shadow:none; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
header .date{color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.h2{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px;letter-spacing:.5px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{position:relative;overflow:hidden}
.person .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sub)}
.dot.on{animation:pulse 1.6s infinite;color:inherit}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 60%, transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.person .state{font-size:12px;color:var(--sub);margin-top:2px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:.5px}
.person .timer.off{color:var(--sub);font-size:18px;font-weight:600}
.person .tot{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.person .bar-top{position:absolute;left:0;top:0;right:0;height:3px}
.me-tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-weight:500}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px}
.btn.stop{background:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger-ghost{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=url]{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);
  font-size:15px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.clock-live{text-align:center;margin-bottom:12px}
.clock-live .big-t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock-live .since{color:var(--sub);font-size:13px}
.proj{padding:14px 16px}
.proj-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.proj-name{font-weight:700}
.goal{margin-top:10px}
.goal-label{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.prow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.prow .who{width:54px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{flex:1;height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
.prow .val{width:112px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px}
.prow .val b{color:var(--text);font-weight:600}
.done{color:var(--accent)!important}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:14px}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{padding:9px 10px;font-size:14px}
.day-h{font-size:12px;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.rec{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .main{flex:1;min-width:0}
.rec .range{font-variant-numeric:tabular-nums;font-size:14px}
.rec .meta{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .dur{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.rec.mine{cursor:pointer}
.list{padding:0;overflow:hidden}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--sub);font-size:11px;font-family:inherit;cursor:pointer}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.act{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .actions{display:flex;gap:10px;margin-top:20px}
.modal .actions .btn{flex:1}
.goal-set{display:flex;align-items:center;gap:10px;margin-top:10px}
.goal-set input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.goal-set .lbl{width:44px}
.goal-set input[type=number]{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:.95}
.center-box{max-width:400px;margin:10vh auto 0;padding:0 16px}
.logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
.hint{font-size:12px;color:var(--sub);margin-top:8px}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.tap{cursor:pointer}
.task .meta .hint{white-space:nowrap}
.task .chk{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.strike{text-decoration:line-through;color:var(--sub)}
.dot.sm{width:7px;height:7px;display:inline-block;margin-right:4px;vertical-align:middle}
.due{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--track);color:var(--sub);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.due.near{background:#fff3d6;color:#9a6b00}.due.soon{background:#ffe3d6;color:#c2501f}.due.over{background:#fde0df;color:var(--danger);font-weight:600}.due.ok{text-decoration:line-through}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .due.near{background:#3a3020;color:#e6b84a}
html:not([data-theme=light]) .due.soon{background:#3d2a22;color:#f08a5d}
html:not([data-theme=light]) .due.over{background:#3d2323;color:#ff7b76}}
html[data-theme=dark] .due.near{background:#3a3020;color:#e6b84a}
html[data-theme=dark] .due.soon{background:#3d2a22;color:#f08a5d}
html[data-theme=dark] .due.over{background:#3d2323;color:#ff7b76}
.tag.gray{background:var(--track);color:var(--sub)}
.track.thin{height:5px;margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv>span:first-child{color:var(--sub);flex:none}.kv>span:last-child{text-align:right}
.lnk{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.sub-r{font-size:11px;color:var(--sub);margin:-2px 0 0 62px}
.lbl-s{font-size:12px;color:var(--sub)}
.meta-i{font-size:12px;color:var(--sub);margin-left:4px}
.seg label{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.seg input{accent-color:var(--accent);margin-right:6px}
input[type=time],input[type=date]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sw.sel{border-color:var(--text)}
.swatch-cur{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none}
nav button{position:relative}
.badge{position:absolute;top:4px;left:50%;margin-left:6px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;line-height:17px;padding:0 4px;font-weight:700}
.seg2{display:inline-flex;background:var(--track);border-radius:10px;padding:3px}
.seg2 button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;font-family:inherit;color:var(--sub);cursor:pointer}
.seg2 button.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{margin-top:4px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin:2px 4px 2px 0;color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);font-weight:600}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.pk input{accent-color:var(--c);width:17px;height:17px;margin:0}
.pk:has(input:checked){border-color:var(--c);background:color-mix(in srgb, var(--c) 12%, transparent)}
.warn-card{background:#fff3d6;color:#7a5600;font-size:14px}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .warn-card{background:#3a3020;color:#e6b84a}}
html[data-theme=dark] .warn-card{background:#3a3020;color:#e6b84a}
.cheer-card{display:flex;gap:12px;align-items:center;background:var(--accent-soft);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.big-e{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.rec.unread{background:var(--accent-soft)}
.rec.win{align-items:flex-start}
.emo-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.emo{border:1px solid var(--line);background:var(--bg);border-radius:20px;font-size:17px;padding:4px 9px;cursor:pointer;line-height:1.2;font-family:inherit;color:var(--text)}
.emo.txt{font-size:12px;padding:6px 11px;color:var(--accent);font-weight:600}
.emo:active,.emo.pop{transform:scale(1.25);transition:transform .15s}
.emo.sel{border-color:var(--accent);background:var(--accent-soft)}
.emo-row.big .emo{font-size:24px;padding:6px 12px}
.sent{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600}
.phr{display:flex;flex-direction:column;gap:6px}
.phrase{text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--text);cursor:pointer}
.phrase:active{border-color:var(--accent)}
textarea{width:100%;margin-top:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:rotate(720deg) translateX(40px)}}
.kpop{position:fixed;left:50%;top:22%;transform:translate(-50%,0) scale(.6);opacity:0;z-index:45;animation:kin .35s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none}
.kpop.out{animation:kout .4s ease forwards}
.kpop-in{background:var(--card);color:var(--text);border-radius:20px;padding:18px 26px;font-size:20px;font-weight:700;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);border:2px solid var(--accent)}
.kpop-sub{font-size:13px;font-weight:400;color:var(--sub);margin-top:4px}
@keyframes kin{to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes kout{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-20px) scale(.9)}}
input:disabled{opacity:.35}
.rem-list{display:flex;flex-wrap:wrap;gap:6px}
.rem-chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}
.rem-chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.rem-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.imp-tbl{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.imp-row{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.imp-row:last-child{border-bottom:0}
.imp-row.bad{background:color-mix(in srgb, var(--danger) 8%, transparent)}
.imp-err{color:var(--danger);font-size:12px;margin-top:3px}
.more-row{text-align:center;margin:-4px 0 10px}
.emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emo-grid .emo{font-size:22px;padding:6px 0;text-align:center}
.up-row{align-items:center}
.up-ic{font-size:18px;flex:none;width:24px;text-align:center}
.up-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .due{align-self:center}
.pill-new{font-size:11px;background:var(--danger);color:#fff;border-radius:10px;padding:1px 8px;font-weight:700}
.hist-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:11px 16px;margin:0 0 10px;font-size:14px;color:var(--sub);box-shadow:var(--shadow)}
.rec.kd{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.react-btn{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:14px;font-size:12px;padding:4px 10px;cursor:pointer;flex:none;align-self:center;font-family:inherit}
.react-bar{position:fixed;z-index:35;display:flex;gap:2px;background:var(--card);border-radius:24px;padding:5px 6px;box-shadow:0 6px 24px rgba(0,0,0,.18);border:1px solid var(--line);animation:kin2 .18s ease-out;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
@keyframes kin2{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.react-bar button{border:0;background:none;font-size:22px;padding:4px 3px;cursor:pointer;border-radius:50%;line-height:1}
.react-bar button:active{transform:scale(1.3)}
.react-bar .rb-more{font-size:18px;color:var(--sub);width:34px}
.react-bar .rb-txt{font-size:13px;color:var(--accent);font-weight:700;padding:4px 10px;border-radius:14px;font-family:inherit}
.my-reacts{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.react-pill{font-size:13px;background:var(--accent-soft);border-radius:12px;padding:1px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-t{font-size:12px;color:var(--text)}
.reply-box{margin-top:8px;-webkit-user-select:text;user-select:text}
.reply-box input{padding:8px 10px;font-size:14px}
.rb-send{white-space:nowrap;flex:none}
.phr-inline{display:flex;flex-wrap:wrap;gap:5px}
.chip-btn{border:1px dashed var(--line);background:var(--bg);border-radius:14px;padding:4px 10px;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer}
.up-proj{padding-bottom:6px;border-bottom:0!important}
.up-proj + .up-proj{border-top:1px solid var(--line)}
.up-proj .up-t{font-weight:700}
.up-task{padding:7px 14px 7px 30px;font-size:14px;border-bottom:0!important;position:relative}
.up-task::before{content:"";position:absolute;left:18px;top:0;bottom:50%;width:8px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:4px}
.up-task + .up-proj{border-top:1px solid var(--line)}
.up-task:last-child{padding-bottom:12px}
.up-task{flex-wrap:wrap} .up-task>.od-acts{flex-basis:100%;margin-top:2px}
.due-mini{font-size:11px;color:var(--sub);white-space:nowrap}
.ex-opts{display:flex;flex-direction:column;gap:8px}
.ex-o{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ex-o:has(input[type=checkbox]:checked){border-color:var(--accent);background:var(--accent-soft)}
.ex-o input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin-top:2px;flex:none}
.ex-o input[type=radio]{accent-color:var(--accent)}
.ex-res{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.ex-file{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.ex-file img{width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;background:#fff}
#exC input{flex:1}
.pt-row{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.pt-n{width:20px;flex:none;color:var(--sub);font-size:12px;text-align:center}
.pt-t{padding:8px 10px!important;font-size:14px!important}
.pt-x{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer;padding:0 4px;flex:none}
.pt-d{flex:1;min-width:150px;padding:6px 8px!important;font-size:13px!important}
.pk-mini{border:1.5px solid var(--line);background:var(--bg);color:var(--sub);border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.pk-mini.on{border-color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--c);font-weight:700}
.pim-g{background:var(--bg)}
.pim-t{padding-left:28px}
.recents{display:flex;flex-direction:column;gap:8px}
.rc-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--text);border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit;cursor:pointer}
.rc-btn:active{transform:scale(.98)}

<script>
// ===================== 基本設定 =====================
const DEF_CUT = { m: 360, wd: 1 };   // 預設：每天 06:00 起算、每週從週一起算
const CFG_KEY = 'wt_cfg', LAST_PROJ_KEY = 'wt_last_project', SCOPE_KEY = 'wt_scope';
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SWATCHES = ['#2f9e8f','#e07a5f','#6c7bd9','#c9a227','#d6589f','#3d8bd9','#7a9e3b','#8e6cc9','#e0563b','#5f6b7a'];
const WD = ['日','一','二','三','四','五','六'];
const EMOJIS = ['👏','💪','🔥','🌟','❤️','☕'];
const EMOJIS_ALL = ['👏','💪','🔥','🌟','❤️','☕','🙏','😊','🎉','👍','🤗','💯','✨','🥳','💖','🙌','🚀','🏆','😍','🥰','😂','🤣','😆','👌','😮','😱','👀','😢','😭','🥺','😤','🙄','😡','😑','😵','😩','💀','😓','🤔','😅','😬','🍀'];
const AC = 'autocomplete="off" autocorrect="off" spellcheck="false"';   // 不讓瀏覽器記住輸入內容

// ===================== 外觀（跟隨系統／淺色／深色） =====================
const THEME_KEY='wt_theme';
function themeMode(){ try{ return localStorage.getItem(THEME_KEY)||'auto'; }catch(e){ return 'auto'; } }
function applyThemeMode(){ const m=themeMode(); if(m==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',m); }
applyThemeMode();
// ===================== 小工具 =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function toast(msg, ms=2400){ const t=$('#toast'); t.innerHTML=msg; t.classList.remove('with-btn'); t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function hms(ms){ ms=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(ms/3600)}:${pad(Math.floor(ms%3600/60))}:${pad(ms%60)}`; }
function zhDur(ms){ ms=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60; return `${h} 小時 ${m} 分 ${s} 秒`; }
function zhShort(ms){ ms=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60); return h?`${h} 小時 ${m} 分`:`${m} 分`; }
function hrs(ms){ return ms/3600000; }
function fmtHrs(ms){ const h=hrs(ms); return h>=100?h.toFixed(0):h.toFixed(1); }
function fmtDT(d){ d=new Date(d); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtDM(d){ d=new Date(d); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtT(d){ d=new Date(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtFull(d){ d=new Date(d); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${fmtT(d)}`; }
function fmtFullM(d){ d=new Date(d); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toInput(d){ d=new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${fmtT(d)}`; }
function toInputM(d){ if(!d) return ''; d=new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function minToHM(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function hmToMin(s){ const [h,m]=String(s||'').split(':').map(Number); return (h||0)*60+(m||0); }
function cutText(c){ return `每天 ${minToHM(c.m)} 起算・每週從週${WD[c.wd]}開始`; }
function ago(t){ const s=(Date.now()-new Date(t))/1000; if(s<60) return '剛剛'; if(s<3600) return `${Math.floor(s/60)} 分鐘前`; if(s<86400) return `${Math.floor(s/3600)} 小時前`; return `${Math.floor(s/86400)} 天前`; }

// ---- 期限 / 到期（含時間）----
function legacyDate(s){ if(!s) return null; const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d,23,59); }
function projDeadline(p){ return p.deadline_at ? new Date(p.deadline_at) : legacyDate(p.deadline); }
function taskDue(t){ return t.due_at ? new Date(t.due_at) : legacyDate(t.due); }
function dueBadge(d, done){
  if(!d) return ''; if(done) return `<span class="due ok">${fmtDM(d)}</span>`;
  const ms=+d-Date.now(), h=ms/3600000;
  const t=new Date(); const dayDiff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);
  let cls='', txt='';
  if(ms<0){ cls='over'; txt=-h<24?`已過期限 ${Math.ceil(-h)} 小時`:`已過期限 ${Math.ceil(-h/24)} 天`; }
  else if(h<24){ cls='soon'; txt=h<1?`剩 ${Math.max(1,Math.round(h*60))} 分鐘`:`剩 ${Math.floor(h)} 小時`; }
  else { cls=dayDiff<=3?'soon':dayDiff<=7?'near':''; txt=`剩 ${dayDiff} 天`; }
  return `<span class="due ${cls}">${fmtDM(d)}・${txt}</span>`;
}

// ---- 期間計算（依切點）----
function shifted(t,c){ return new Date(+new Date(t) - c.m*60000); }
function atCut(y,mo,d,c){ return new Date(y,mo,d,0,c.m,0,0); }
function periodOf(kind, t=Date.now(), offset=0, c=DEF_CUT){
  const s=shifted(t,c); let a,b;
  if(kind==='day'){ a=atCut(s.getFullYear(),s.getMonth(),s.getDate()+offset,c); b=atCut(s.getFullYear(),s.getMonth(),s.getDate()+offset+1,c); }
  else if(kind==='week'){ const back=(s.getDay()-c.wd+7)%7; const d0=s.getDate()-back+offset*7; a=atCut(s.getFullYear(),s.getMonth(),d0,c); b=atCut(s.getFullYear(),s.getMonth(),d0+7,c); }
  else { a=atCut(s.getFullYear(),s.getMonth()+offset,1,c); b=atCut(s.getFullYear(),s.getMonth()+offset+1,1,c); }
  return {start:a,end:b};
}
function workDateKey(t,c){ const s=shifted(t,c); return `${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`; }
function sessEnd(s){ return s.end_at ? +new Date(s.end_at) : Date.now(); }
function overlapMs(s,p){ if(s.background) return 0; const a=Math.max(+new Date(s.start_at),+p.start), b=Math.min(sessEnd(s),+p.end); return Math.max(0,b-a)*(s.share==null?1:+s.share); }
function rawOverlapMs(s,p){ const a=Math.max(+new Date(s.start_at),+p.start), b=Math.min(sessEnd(s),+p.end); return Math.max(0,b-a); }
function weightedDur(s){ return s.background?0:(sessEnd(s)-new Date(s.start_at))*(s.share==null?1:+s.share); }
function shareTag(s){ return s.background?'🌱 順手':(s.share!=null && +s.share<1)?`約 ${Math.round(+s.share*100)}%`:''; }
function sumMs(list,p){ return list.reduce((t,s)=>t+overlapMs(s,p),0); }
const ALL_TIME={start:new Date(0),end:new Date(8.64e15)};
function rangeLabel(kind,p){ const last=new Date(+p.end-86400000);
  return kind==='day'?`${p.start.getMonth()+1}/${p.start.getDate()}`:`${p.start.getMonth()+1}/${p.start.getDate()} – ${last.getMonth()+1}/${last.getDate()}`; }

async function loadSessions(){
  if(qGet().length && navigator.onLine!==false) await qFlush();
  const since=new Date(Date.now()-430*86400000).toISOString(); let all=[],from=0;
  while(true){
    const {data,error}=await sb.from('sessions').select('*').gte('start_at',since).order('start_at',{ascending:false}).range(from,from+999);
    if(error){ toast('讀取紀錄失敗'); break; }
    all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000;
  }
  st.sessions=all.filter(x=>!x.deleted_at); st.trashS=all.filter(x=>x.deleted_at);
  if(me){ const opens=st.sessions.filter(x=>x.user_id!==me.id && !x.end_at);
    // 對方開工不跳通知（看今天頁就知道）
    
    loadSessions.seen=new Set(opens.map(o=>o.id)); loadSessions.ready=true; }
}

const pending=new Set(); let reloadT=null;
function scheduleReload(which){
  pending.add(which); clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{
    const ws=[...pending]; pending.clear();
    if(ws.includes('all')) await loadAll(); else await Promise.all(ws.map(w=>LOADERS[w]()));
    if(!document.querySelector('.modal-bg') && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();
    else updateBadge();
  },300);
}
let channel=null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('wt-sync');
  Object.keys(LOADERS).forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>scheduleReload(t)));
  channel.subscribe();
}

  $('#app').innerHTML=`<div class="wrap"><div class="empty">載入中…</div></div>`;
  await purgeTrash(); await loadAll();
  if(!prof(me.id)){

  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && me){ subscribe(); scheduleReload('all'); } });
  setInterval(tick,1000);
}

async function pushPublicKey(){ const c=cfg(); const r=await fetch(c.url.replace(/\/$/,'')+'/functions/v1/wt-push',{headers:{apikey:c.key}});
  if(!r.ok) throw new Error('fn '+r.status); const j=await r.json(); if(!j.publicKey) throw new Error('nokey'); return j.publicKey; }
async function pushStatus(){ if(!pushSupported()) return 'unsupported'; if(Notification.permission==='denied') return 'denied';
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription(); return sub?'on':'off'; }catch(e){ return 'off'; } }
async function enablePush(){
  if(!pushSupported()){ const E=notifyEnv(); return toast(E.ios&&!E.standalone?'iPhone 要先把 App 加到主畫面，再從主畫面打開才能開啟':'這個瀏覽器不支援推播'); }
  const perm=await Notification.requestPermission(); if(perm!=='granted') return toast('沒有允許通知，請到瀏覽器設定打開');
  let pk; try{ pk=await pushPublicKey(); }catch(e){ return modal(`<h3>推播伺服器還沒準備好</h3><p class="hint" style="font-size:14px">請照手冊「設定推播」那一章，把 <b>wt-push</b> 建立好，並把「Verify JWT」關掉。<br>（錯誤代碼：${esc(e.message)}）</p><div class="actions"><button class="btn" id="pxX">知道了</button></div>`,(el,close)=>{ el.querySelector('#pxX').onclick=close; }); }
  try{ const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(pk)});
    const j=sub.toJSON(); const {error}=await sb.from('push_subs').upsert({user_id:me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,180)},{onConflict:'endpoint'});
    if(error) throw error; toast('推播已開啟 ✓ 可以按「送一則測試」試試'); return true;
  }catch(e){ toast('開啟推播失敗：'+esc(e.message||e)); return false; } }
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ const ep=sub.endpoint; await sub.unsubscribe(); await sb.from('push_subs').delete().eq('endpoint',ep); }
    toast('這支裝置已關閉推播'); }catch(e){ toast('關閉失敗：'+esc(e.message||e)); } }

let titleT=null; function flashTitle(msg){ clearInterval(titleT); if(!msg){ document.title='Work Together'; return; } let f=0; titleT=setInterval(()=>{ document.title=(f=!f)?msg:'Work Together'; },1000); }
function ringStart(o){

  el.querySelector('[data-r="2"]').onclick=()=>{ ringStop(); o.on2(); };

  const sn=el.querySelector('#rgSnd'); if(sn) sn.onclick=()=>{ Snd.ctx(); if(c.vib&&navigator.vibrate) try{ navigator.vibrate([400,150,400]); }catch(e){} setTimeout(()=>{ Snd.play(c.sound); if(Snd.ready()) sn.remove(); },150); };
}
function ringStop(){ if(!ringing) return; clearInterval(ringing.iv); clearTimeout(ringing.auto); Snd.hush(); if(navigator.vibrate) try{ navigator.vibrate(0); }catch(e){}
  ringing.el.remove(); ringing=null; if(!awakeWanted()) keepAwake(false); flashTitle(null); }

// ---- 番茄鐘流程 ----
function brkLenOf(r){ return (r.round % r.p.rounds===0) ? r.p.long : r.p.brk; }
async function startPomo(key, pid, tid, intent){
  const p=presetOf(key); if(!p) return; const end=Date.now()+p.focus*60000;
  await setRun({key,p,round:1,phase:'focus',end,cnt:0,pid,tid,intent:intent||null,rid:uuid(),dev:DEV});
  pushJob('pomo',end,`${pcfg().rest} ${p.focus} 分鐘到了`,`第 1 輪完成，${pcfg().msg}`);
}
let pomoBusy=false;
async function pomoFocusEnd(){
  const r=prun(); if(!r||r.phase!=='focus'||ringing||pomoBusy) return;
  pomoBusy=true; try{ await pomoFocusEnd2(r); } finally { pomoBusy=false; } }
// 兩台裝置都開著時：開始番茄鐘的那台馬上算；另一台等 6 秒，確認那台沒算才補算（避免同一顆算兩次）
async function countTom(r){ const tag=r.rid+'#'+r.round;
  if(r.dev && r.dev!==DEV){ await new Promise(ok=>setTimeout(ok,6000));
    try{ const {data}=await sb.from('profiles').select('*').eq('id',me.id); const f=data&&data[0]&&data[0].pomo_run; if(f && f.rid===r.rid && (f.cnt||0)>=r.round) return; }catch(e){} }
  const cur=prun(); if(cur && cur.rid===r.rid){ cur.cnt=Math.max(cur.cnt||0,r.round); await setRun(cur); }
  await addTomato(tag); render(); }
async function pomoFocusEnd2(r){
  if(r.round>=r.p.rounds) egg('pomo_set');
  if((r.cnt||0)<r.round){ r.cnt=r.round; if(!r.rid) r.rid=uuid(); countTom({...r}); }
  pushJob('pomo',Date.now()+60000,`${pcfg().rest} ${r.p.focus} 分鐘到了`,`第 ${r.round} 輪完成，${pcfg().msg}`);   // 沒按掉的話，1 分鐘後推播
  const bl=brkLenOf(r);
  ringStart({kind:'focus', emoji:pcfg().rest, title:`${r.p.focus} 分鐘到了`, sub:pcfg().msg, flash:`${pcfg().rest} 休息時間到`,
    toms:tomRow(r.round,r.p.rounds), rnd:`第 ${r.round} / ${r.p.rounds} 輪`,
    b1:`休息 ${bl} 分鐘`, b2:'再做一下（5 分鐘）',
    on1:()=>pomoBreak(), on3:()=>stopWork(false), on2:async()=>{ r.end=Date.now()+5*60000; await setRun(r); pushJob('pomo',r.end,`${pcfg().rest} 該休息囉`,pcfg().msg); render(); toast('好，再 5 分鐘 💪'); } });
}
async function pomoBreak(){
  const r=prun(); if(!r) return stopWork(true);
  const bl=brkLenOf(r), end=Date.now()+bl*60000; r.phase='break'; r.end=end; await setRun(r);
  pushJob('pomo',end,`${pcfg().start} 休息結束`,`準備好就回來，開始第 ${r.round+1} 輪`);
  await stopWork(true,true);
}
async function pomoBreakEnd(){
  const r=prun(); if(!r||r.phase!=='break'||ringing||pomoBusy) return;
  if(pcfg().auto){ pomoBusy=true; try{ Snd.play(pcfg().sound); await pomoResume(); } finally { pomoBusy=false; } return; }
  pushJob('pomo',Date.now()+60000,`${pcfg().start} 休息結束`,`準備好就回來，開始第 ${r.round+1} 輪`);
  ringStart({kind:'break', emoji:pcfg().start, title:'休息結束', sub:`準備好就開始第 ${r.round+1} 輪`, flash:`${pcfg().start} 休息結束`,
    toms:tomRow(r.round,r.p.rounds), rnd:`已完成 ${r.round} 輪`,
    b1:`▶ 開始第 ${r.round+1} 輪`, b2:'再休息 3 分鐘',
    on1:()=>pomoResume(), on3:()=>endFromPause(false), on2:async()=>{ r.end=Date.now()+3*60000; await setRun(r); pushJob('pomo',r.end,`${pcfg().start} 休息結束`,`準備好就回來，開始第 ${r.round+1} 輪`); render(); } });
}
async function pomoResume(pid,tid){
  const r=prun(), z=pausedOf(me.id); if(!r) return;
  const P=pid!==undefined?pid:(z?.project_id??r.pid), T=pid!==undefined?tid:(z?.task_id??r.tid);
  r.round+=1; r.phase='focus'; r.end=Date.now()+r.p.focus*60000; r.pid=P; r.tid=T; await setRun(r);
  pushJob('pomo',r.end,`${pcfg().rest} ${r.p.focus} 分鐘到了`,`第 ${r.round} 輪完成，${pcfg().msg}`);
  const same=(P||null)===(r.pid||null)&&(T||null)===(r.tid||null);
  await startWork(P,T,{keepRun:true,intent:same?lastIntent(P,T):null});
}
function lastIntent(pid,tid){ const s=st.sessions.filter(x=>x.user_id===me.id && !x.split_of && (x.project_id||null)===(pid||null) && (x.task_id||null)===(tid||null)).sort((a,b)=>new Date(b.start_at)-new Date(a.start_at))[0];
  return s&&s.intent||null; }
async function pomoClear(){ if(prun()){ await setRun(null); } pushCancel('pomo'); }
function pomoTick(){
  if(!me) return; const r=prun();
  if(ringing && ringing.kind!=='test'){ const still=r && r.phase===ringing.kind && Date.now()>=r.end; if(!still) ringStop(); }
  if(!r) return;
  const o=openOf(me.id), z=pausedOf(me.id);
  if(r.phase==='focus' && o && Date.now()>=r.end) pomoFocusEnd();
  else if(r.phase==='break' && z && !o && Date.now()>=r.end) pomoBreakEnd();
  else if(!o && !z && !ringing){ pomoTick.idle=(pomoTick.idle||0)+1; if(pomoTick.idle>=5){ pomoTick.idle=0; pomoClear(); } return; }   // 已經收工
  pomoTick.idle=0;
}

// ---- 網路斷了也能用：先記在手機裡，連上再補 ----
const Q_KEY='wt_q';
function qGet(){ try{ return JSON.parse(localStorage.getItem(Q_KEY)||'[]'); }catch(e){ return []; } }
function qSet(q){ try{ q.length?localStorage.setItem(Q_KEY,JSON.stringify(q)):localStorage.removeItem(Q_KEY); }catch(e){} }
function isNetErr(e){ const m=String(e&&(e.message||e)||''); return (typeof navigator!=='undefined' && navigator.onLine===false) || /Failed to fetch|NetworkError|Load failed|network error|ERR_INTERNET|ERR_NETWORK/i.test(m); }
function friendlyErr(e){ if(isNetErr(e)) return '網路好像斷了，請稍後再試'; const m=String(e&&(e.message||e)||'');
  if(/JWT|expired|auth/i.test(m)) return '登入好像過期了，請重新整理再試一次'; if(/permission|policy|row-level/i.test(m)) return '沒有權限做這件事'; return '出了點問題，請再試一次'; }
function runOp(op){ let r=sb.from(op.t); if(op.k==='insert') return r.insert(op.row); r=r.update(op.row); for(const [c,v] of Object.entries(op.m||{})) r=r.eq(c,v); return r; }
function qPush(op){ const q=qGet(); q.push(op); qSet(q); offBar(); }
async function W(op){
  if(qGet().length){ qPush(op); return {queued:true}; }
  try{ const {error}=await runOp(op); if(error){ if(isNetErr(error)){ qPush(op); return {queued:true}; } return {error}; } return {}; }
  catch(e){ if(isNetErr(e)){ qPush(op); return {queued:true}; } return {error:e}; } }
let flushing=false;
async function qFlush(){ if(flushing) return; const q=qGet(); if(!q.length) return; flushing=true;
  while(q.length){ try{ const {error}=await runOp(q[0]); if(error && isNetErr(error)) break; q.shift(); qSet(q); }catch(e){ break; } }
  flushing=false; offBar();
  if(!q.length && me){ toast('已補上離線時的紀錄 ✓'); await Promise.all([loadSessions(),loadProfiles()]); render(); } }
function offBar(){ const b=document.getElementById('offBar'); if(!b) return; const on=navigator.onLine===false||qGet().length>0;
  b.innerHTML=on?`<div class="offbar">📡 <span>網路好像斷了。已先幫你記在手機裡，連上後會自動補上，可以照常使用。</span></div>`:''; }
window.addEventListener('online',()=>{ offBar(); setTimeout(qFlush,800); });
window.addEventListener('offline',offBar);
setInterval(()=>{ if(navigator.onLine!==false && qGet().length) qFlush(); },30000);

// ---- 同一個人多台裝置：每件事只提醒一次（記在帳號裡，不是記在各自的裝置）----
let lastAct=Date.now(); ['pointerdown','keydown','touchstart'].forEach(e=>window.addEventListener(e,()=>{ lastAct=Date.now(); },{capture:true,passive:true}));
function seenOf(){ return (prof(me.id)?.pomo_cfg||{}).seen||{}; }
async function claimOnce(k,v){
  if(window.__noClaim) return true;
  if(seenOf()[k]===v) return false;
  // 正在用的那台先拿；放在背景的裝置晚一點再確認，避免兩台同時跳
  // 剛剛有在操作的那台最先（幾乎不用等）；閒置越久等越久；放在背景的最後
  const vis=document.visibilityState==='visible', idle=Date.now()-lastAct;
  await new Promise(ok=>setTimeout(ok, vis ? Math.min(2400, idle/50)+Math.random()*120 : 2600+Math.random()*600));
  try{
    const {data,error}=await sb.from('profiles').select('*').eq('id',me.id); if(error) throw error;
    const f=(data&&data[0]&&data[0].pomo_cfg)||{}, sn={...(f.seen||{})};
    if(sn[k]===v) { const p=prof(me.id); if(p) p.pomo_cfg={...(p.pomo_cfg||{}),seen:sn}; return false; }
    sn[k]=v; const ks=Object.keys(sn).filter(x=>x.startsWith('p:')); if(ks.length>80) ks.slice(0,ks.length-80).forEach(x=>delete sn[x]);
    const oid=openOf(me.id)?.id; Object.keys(sn).filter(x=>/^o[ts]:/.test(x) && x.slice(3)!==oid).forEach(x=>delete sn[x]);
    const c={...f,seen:sn}; const p=prof(me.id); if(p) p.pomo_cfg={...(p.pomo_cfg||{}),...c};
    await sb.from('profiles').update({pomo_cfg:c}).eq('id',me.id);
  }catch(e){ /* 沒網路：照樣提醒，至少這台會看到 */ }
  return true;
}
// 等畫面上沒有其他視窗、也沒在工作時才跳（最多等 2 分鐘）
function whenFree(fn,tries=150){ if(document.querySelector('.modal-bg')||document.querySelector('.ring-ov')){ if(tries>0) setTimeout(()=>whenFree(fn,tries-1),800); return; } if(openOf(me.id)) return; fn(); }
async function seenSet(k,v){ try{ const {data}=await sb.from('profiles').select('*').eq('id',me.id); const f=(data&&data[0]&&data[0].pomo_cfg)||prof(me.id)?.pomo_cfg||{};
  const c={...f,seen:{...(f.seen||{}),[k]:v}}; const p=prof(me.id); if(p) p.pomo_cfg={...(p.pomo_cfg||{}),...c}; await W({t:'profiles',k:'update',row:{pomo_cfg:c},m:{id:me.id}}); }catch(e){} }

const KINDS=[['daily_hours','day','今日','每日'],['weekly_hours','week','本週','每週'],['monthly_hours','month','本月','每月']];
function goalReached(uid,p,f,k,excl){ const per=periodOf(k,Date.now(),0,projCut(uid,p.id)); return sumMs(st.sessions.filter(s=>s.user_id===uid&&s.project_id===p.id&&s.id!==excl),per) >= +p[f]*3600000; }
function remainText(ms){ if(ms<3600000) return `${Math.max(1,Math.ceil(ms/60000))} 分鐘`; const h=Math.ceil(ms/360000)/10; return `${Number.isInteger(h)?h:h.toFixed(1)} 小時`; }
function zhMin(ms){ const m=Math.floor(ms/60000), h=Math.floor(m/60); return h?`${h} 小時 ${m%60} 分鐘`:`${m} 分鐘`; }
function goalBlock(p, mode='pair'){
  const ppl=projPeople(p);
  if(mode==='self' && ppl.includes(me.id)) return goalSelf(p);
  if(mode==='team' && ppl.length>1) return goalTeam(p);
  return KINDS.filter(([f])=>p[f]>0).map(([f,k,lbl])=>{
    const goal=+p[f]*3600000, refU=ppl.includes(me.id)?me.id:ppl[0], refP=periodOf(k,Date.now(),0,projCut(refU,p.id));
    return `<div class="goal"><div class="goal-label"><span>${lbl} 目標 ${+p[f]} 小時</span><span>${rangeLabel(k,refP)}</span></div>
      ${ppl.map(uid=>{ const per=periodOf(k,Date.now(),0,projCut(uid,p.id));
        const ms=sumMs(st.sessions.filter(s=>s.user_id===uid && s.project_id===p.id),per), pct=Math.min(100,ms/goal*100), ok=ms>=goal;
        const diff=uid!==refU && (+per.start!==+refP.start) ? `<div class="sub-r">${rangeLabel(k,per)}（依${esc(nameOf(uid))}的計時設定）</div>`:'';
        const gg=uid===me.id ? `<div class="gg ${ok?'ok':''}">${ok?`${lbl}已達標，剩下都是加分 ✨`:`還差 ${remainText(goal-ms)}就達標 💪`}</div>`:'';
        return `<div class="prow"><span class="who">${esc(nameOf(uid))}</span><div class="track"><div class="fill" style="width:${pct}%;background:${colorOf(uid)}"></div></div>
          <span class="val ${ok?'done':''}"><b class="${ok?'done':''}">${fmtHrs(ms)}</b> / ${+p[f]} 時${ok?' ✓':''}</span></div>${gg}${diff}`; }).join('')}
    </div>`; }).join('');
}
const PREV_LBL={day:'昨天',week:'上週',month:'上個月'};
function goalSelf(p){
  return KINDS.filter(([f])=>p[f]>0).map(([f,k,lbl])=>{
    const goal=+p[f]*3600000, c=projCut(me.id,p.id), per=periodOf(k,Date.now(),0,c), prev=periodOf(k,Date.now(),-1,c);
    const mine=st.sessions.filter(s=>s.user_id===me.id && s.project_id===p.id);
    const ms=sumMs(mine,per), ok=ms>=goal, pct=Math.min(100,ms/goal*100);
    const prevMs=sumMs(mine,{start:prev.start,end:new Date(+prev.start+(Date.now()-per.start))}), diff=ms-prevMs;
    const cmp = (ms||prevMs) ? (Math.abs(diff)<360000?`跟${PREV_LBL[k]}同一時間差不多 👍`:diff>0?`📈 比${PREV_LBL[k]}同一時間多 ${remainText(diff)}`:`比${PREV_LBL[k]}同一時間少 ${remainText(-diff)}，照自己的節奏就好 🌱`) : '';
    return `<div class="goal"><div class="goal-label"><span>${lbl} 目標 ${+p[f]} 小時</span><span>${rangeLabel(k,per)}</span></div>
      <div class="big-prog"><b>${fmtHrs(ms)}</b><span>/ ${+p[f]} 小時</span></div>
      <div class="track" style="height:12px"><div class="fill" style="width:${pct}%;background:${colorOf(me.id)}"></div></div>
      <div class="gg ${ok?'ok':''}" style="margin-left:0;margin-top:6px">${ok?`${lbl}已達標，剩下都是加分 ✨`:`還差 ${remainText(goal-ms)}就達標 💪`}</div>
      ${cmp?`<div class="cmp">${cmp}</div>`:''}</div>`; }).join('');
}
function goalTeam(p){
  const ppl=projPeople(p);
  return KINDS.filter(([f])=>p[f]>0).map(([f,k,lbl])=>{
    const each=+p[f]*3600000, goal=each*ppl.length, myP=periodOf(k,Date.now(),0,projCut(me.id,p.id));
    const vals=ppl.map(u=>({u,ms:sumMs(st.sessions.filter(s=>s.user_id===u && s.project_id===p.id),periodOf(k,Date.now(),0,projCut(u,p.id)))}));

      <div class="track" style="height:12px;display:flex">${vals.map(v=>`<div style="width:${Math.min(100,v.ms/goal*100)}%;background:${colorOf(v.u)}"></div>`).join('')}</div>

      <div class="gg ${ok?'ok':''}" style="margin-left:0;margin-top:6px">${ok?'一起達標了！剩下都是加分 🎉':`再 ${remainText(goal-tot)}就一起達標 ✨`}</div></div>`; }).join('');
}

  const row={id:uuid(),user_id:me.id,project_id:pid||null,task_id:pid?(tid||null):null,start_at:new Date().toISOString()}; if(opts.intent) row.intent=opts.intent;

  if(pausedOf(me.id)){ await W({t:'profiles',k:'update',row:{paused:null},m:{id:me.id}}); prof(me.id).paused=null; }
  if(r1.queued || qGet().length){ st.sessions.unshift({...row,end_at:null}); } else await Promise.all([loadSessions(),loadProfiles()]);

}
async function stopWork(pause,silent,opt={}){

function checkOvertime(){
  const o=openOf(me.id); if(!o || document.querySelector('.modal-bg')) return;
  const h=+(prof(me.id)?.remind_hours ?? 3); if(!(h>0)) return;
  let next=+new Date(o.start_at)+h*3600000; try{ const s=localStorage.getItem('wt_snooze_'+o.id); if(s) next=+s; }catch(e){}
  const sv=+(seenOf()['os:'+o.id]||0); if(sv>next) next=sv;
  if(Date.now()<next || checkOvertime.busy) return;
  checkOvertime.busy=true; claimOnce('ot:'+o.id,String(next)).then(async ok=>{ checkOvertime.busy=false;
    try{ localStorage.setItem('wt_snooze_'+o.id, Date.now()+3600000); }catch(e){}
    if(ok){ await seenSet('os:'+o.id, Date.now()+3600000); overtimeShow(o); } });
}
function overtimeShow(o){ if(document.querySelector('.modal-bg')) return;
  const el=Date.now()-new Date(o.start_at);
  if(document.hidden){ notifyLocal(`已經工作 ${zhShort(el)} 了，還在做嗎？`,false,'wt-overtime'); try{ localStorage.setItem('wt_snooze_'+o.id, Date.now()+3600000); }catch(e){} return; }
  try{ localStorage.setItem('wt_snooze_'+o.id, Date.now()+3600000); }catch(e){}
  modal(`<h3>⏰ 已經工作 ${zhShort(el)} 了</h3><p class="hint">${sessLabel(o)}・從 ${fmtDT(o.start_at)} 開始。還在做嗎？還是忘了按結束？</p>
    <button class="btn big" id="otGo" style="margin-top:8px">還在做（1 小時後再提醒）</button>
    <button class="btn big ghost" id="otPause" style="margin-top:8px">☕ 先休息一下</button>
    <button class="btn big ghost" id="otEnd" style="margin-top:8px">結束工作（現在）</button>
    <button class="btn big ghost" id="otFix" style="margin-top:8px">其實早就結束了，我要改時間</button>`,(m,close)=>{
    m.querySelector('#otGo').onclick=()=>{ close(); toast('好的，繼續加油 💪'); };
    m.querySelector('#otPause').onclick=()=>{ close(); stopWork(true); };
    m.querySelector('#otEnd').onclick=()=>{ close(); stopWork(false); };
    m.querySelector('#otFix').onclick=async()=>{ close(); const {error}=await sb.from('sessions').update({end_at:new Date().toISOString()}).eq('id',o.id);

  });
}
async function notifyLocal(body, force, tag){
  try{ if(!('Notification' in window) || Notification.permission!=='granted') return false;
    if(!force && !document.hidden) return false;
    const reg=navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    const opt={body,icon:'icon-192.png',badge:'icon-192.png',tag:tag||('wt-'+Date.now())};
    if(reg && reg.showNotification) await reg.showNotification('Work Together',opt); else new Notification('Work Together',opt);
    return true; }catch(e){ return false; }
}

function dayList(range,c){ const out=[]; let p=periodOf('day',range.start,0,c); let guard=0;

function exportData(range, uids, pid){

function makeCanvas(w,h){ const c=document.createElement('canvas'), s=2; c.width=w*s; c.height=h*s; const x=c.getContext('2d'); x.scale(s,s);
  x.fillStyle='#ffffff'; x.fillRect(0,0,w,h); x.textBaseline='middle'; return [c,x]; }
function chartHeader(x,w,title,sub,D){
  x.fillStyle='#1d2129'; x.font=`bold 22px ${CH_FONT}`; x.textAlign='left'; x.fillText(title,32,34);
  x.fillStyle='#6b7280'; x.font=`14px ${CH_FONT}`; x.fillText(sub,32,62);
  let lx=w-32; x.textAlign='right'; x.font=`14px ${CH_FONT}`;
  [...D.uids].reverse().forEach(u=>{ const n=nameOf(u); const tw=x.measureText(n).width; x.fillStyle='#1d2129'; x.fillText(n,lx,34); lx-=tw+8;
    x.fillStyle=cssColor(colorOf(u)); x.beginPath(); x.roundRect(lx-12,28,12,12,3); x.fill(); lx-=28; });
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
function rangeSub(D){ const f=d=>`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; const a=D.days[0]?.start||D.range.start, z=(D.days[D.days.length-1]||{start:D.range.start}).start; return `${f(a)}（${WD[a.getDay()]}）～ ${f(z)}（${WD[z.getDay()]}）・${D.pid==='all'?'全部專案':projName(D.pid)}・依 ${nameOf(me.id)} 的計時設定（${cutText(D.c)}）`; }

function barByDate(D){
  let groups=D.days.map(p=>({p,label:`${p.start.getMonth()+1}/${p.start.getDate()}`,sub:WD[p.start.getDay()]})), unit='日';
  if(groups.length>31){ unit='週'; const ws=[]; let p=periodOf('week',D.range.start,0,D.c);
    while(+p.start<+D.range.end){ ws.push({p:{start:new Date(Math.max(+p.start,+D.range.start)),end:new Date(Math.min(+p.end,+D.range.end))},label:`${p.start.getMonth()+1}/${p.start.getDate()}`,sub:'週'}); p=periodOf('week',p.end,0,D.c); } groups=ws; }
  const vals=groups.map(g=>D.uids.map(u=>hrs(sumMs(D.ss.filter(s=>s.user_id===u),g.p))));
  const max=niceMax(Math.max(0.5,...vals.flat()));
  const W=Math.max(900, 120+groups.length*(D.uids.length*16+14)), H=520, L=64, R=24, T=100, B=70, cw=W-L-R, ch=H-T-B;
  const [c,x]=makeCanvas(W,H);
  chartHeader(x,W,`每${unit}工作時數`,rangeSub(D),D);
  x.font=`12px ${CH_FONT}`; x.textAlign='right';
  for(let i=0;i<=5;i++){ const v=max*i/5, y=T+ch-ch*i/5; x.strokeStyle=i?'#eceef1':'#c9ccd2'; x.lineWidth=1; x.beginPath(); x.moveTo(L,y); x.lineTo(W-R,y); x.stroke();
    x.fillStyle='#6b7280'; x.fillText((Math.round(v*10)/10)+'h',L-8,y); }
  const gw=cw/groups.length, bw=Math.min(28,(gw-10)/D.uids.length);

    D.uids.forEach((u,j)=>{ const v=vals[i][j], h=ch*v/max, bx=gx+bw*j, by=T+ch-h;
      x.fillStyle=cssColor(colorOf(u)); if(h>0){ x.beginPath(); x.roundRect(bx+1,by,bw-2,h,[4,4,0,0]); x.fill(); }
      if(v>0 && bw>=14){ x.fillStyle='#1d2129'; x.font=`10px ${CH_FONT}`; x.textAlign='center'; x.fillText(v>=10?v.toFixed(0):v.toFixed(1),bx+bw/2,by-8); } });
    x.fillStyle='#1d2129'; x.font=`12px ${CH_FONT}`; x.textAlign='center'; x.fillText(g.label,L+gw*i+gw/2,T+ch+18);
    x.fillStyle=(g.sub==='六'||g.sub==='日')?'#e0563b':'#9aa1ad'; x.font=`11px ${CH_FONT}`; x.fillText(g.sub,L+gw*i+gw/2,T+ch+36); });
  x.fillStyle='#6b7280'; x.font=`13px ${CH_FONT}`; x.textAlign='left';
  x.fillText('合計：'+D.uids.map(u=>`${nameOf(u)} ${fmtHrs(sumMs(D.ss.filter(s=>s.user_id===u),D.range))} 小時`).join('　'),L,H-16);
  return c;

    D.uids.forEach((u,j)=>{ const w=cw*r.v[j]/max, y=y0+j*barH; x.fillStyle=cssColor(colorOf(u));
      if(w>0){ x.beginPath(); x.roundRect(L,y+2,w,barH-4,[0,4,4,0]); x.fill(); }
      x.fillStyle='#1d2129'; x.font=`12px ${CH_FONT}`; x.textAlign='left'; x.fillText(`${r.v[j].toFixed(1)} h`,L+w+6,y+barH/2); }); });

}

function timelineChart(D){
  let days=D.days; let note='';
  if(days.length>62){ days=days.slice(-62); note='（期間超過 62 天，只顯示最後 62 天）'; }
  const lanes=D.uids.length, laneH=16, rowH=lanes*laneH+10, L=96, R=24, T=110, W=1100, cw=W-L-R;
  const H=T+days.length*rowH+50;
  const [c,x]=makeCanvas(W,H);
  chartHeader(x,W,'每日工作時段'+note,rangeSub(D),D);
  const startH=D.c.m/60;
  x.font=`11px ${CH_FONT}`; x.textAlign='center';
  for(let h=0;h<=24;h+=2){ const gx=L+cw*h/24; x.strokeStyle=h%6===0?'#d5d8dd':'#eef0f2'; x.beginPath(); x.moveTo(gx,T-6); x.lineTo(gx,T+days.length*rowH); x.stroke();
    const hh=(startH+h)%24; x.fillStyle='#6b7280'; x.fillText(`${pad(Math.floor(hh))}:${pad(Math.round((hh%1)*60))}`,gx,T-16); }
  days.forEach((p,i)=>{ const y0=T+i*rowH;
    if(i%2===0){ x.fillStyle='#f7f8fa'; x.fillRect(L,y0,cw,rowH); }
    const wd=p.start.getDay(); x.fillStyle=(wd===0||wd===6)?'#e0563b':'#1d2129'; x.font=`12px ${CH_FONT}`; x.textAlign='right';
    x.fillText(`${p.start.getMonth()+1}/${p.start.getDate()}（${WD[wd]}）`,L-10,y0+rowH/2);
    D.uids.forEach((u,j)=>{ x.fillStyle=cssColor(colorOf(u));
      D.ss.filter(s=>s.user_id===u).forEach(s=>{ const a=Math.max(+new Date(s.start_at),+p.start), b=Math.min(sessEnd(s),+p.end); if(b<=a) return;
        const x1=L+cw*(a-p.start)/86400000, x2=L+cw*(b-p.start)/86400000;
        x.beginPath(); x.roundRect(x1,y0+5+j*laneH,Math.max(2,x2-x1),laneH-3,3); x.fill(); }); });
    x.textAlign='left'; x.font=`10px ${CH_FONT}`; x.fillStyle='#6b7280';
  });
  x.fillStyle='#6b7280'; x.font=`12px ${CH_FONT}`; x.textAlign='left';
  x.fillText(`每列一天，由 ${minToHM(D.c.m)} 起算 24 小時；${lanes>1?'每位人員各一條，':''}色塊為工作時段`,L,H-20);
  return c;
}

function matchPerson(txt){
  const t=String(txt||'').trim(); if(!t) return {ids:[],bad:[]};
  if(/^(兩人|兩個人|全部|雙方|都要|all)$/i.test(t)) return {ids:people(),bad:[]};
  const parts=t.split(/[、,，;；/\s]+/).filter(Boolean), ids=[], bad=[];
  parts.forEach(p=>{ const low=p.toLowerCase();
    const u=people().find(u=>nameOf(u).toLowerCase()===low || (p==='我'&&u===me.id) || (prof(u)?.name||'').toLowerCase().startsWith(low));
    if(u){ if(!ids.includes(u)) ids.push(u); } else bad.push(p); });
  return {ids,bad};
}
function parseDateCell(v){
  if(v===undefined||v===null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v==='number'){ // Excel 序號日期
    const d=new Date(Math.round((v-25569)*86400000)); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()); }
  let s=String(v).trim().replace(/[年月]/g,'/').replace(/日/g,' ').replace(/\s+/g,' ');
  let m=s.match(/^(\d{2,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){ let y=+m[1]; if(y<1000) y+=1911; return new Date(y,+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0,0,m[4]?1:0); } // 民國年也可
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?$/);
  if(m){ const y=new Date().getFullYear(); return new Date(y,+m[1]-1,+m[2],m[3]?+m[3]:0,m[4]?+m[4]:0,0,m[3]?1:0); }
  return 'bad';
}
function parseTimeCell(v){
  if(v===undefined||v===null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return [v.getHours(),v.getMinutes()];
  if(typeof v==='number' && v<1){ const mins=Math.round(v*1440); return [Math.floor(mins/60),mins%60]; }
  const m=String(v).trim().match(/^(上午|下午)?\s*(\d{1,2})[:：](\d{2})/); if(!m) return 'bad';
  let h=+m[2]; if(m[1]==='下午'&&h<12) h+=12; if(m[1]==='上午'&&h===12) h=0; return [h,+m[3]];
}
function uuid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }); }
// 一列任務：[名稱, 負責人, 到期日, 到期時間]
function parseTaskCells(r){
  const title=String(r[0]??'').trim(), who=matchPerson(r[1]), d=parseDateCell(r[2]), tm=parseTimeCell(r[3]), errs=[];
  if(who.bad.length) errs.push(`找不到負責人「${who.bad.join('、')}」`);
  let due=null;
  if(d==='bad') errs.push('到期日格式看不懂');
  else if(d){ due=new Date(d);
    if(tm==='bad') errs.push('到期時間格式看不懂');
    else if(tm) due.setHours(tm[0],tm[1],0,0);
    else if(!d.getMilliseconds() && d.getHours()===0 && d.getMinutes()===0) due.setHours(18,0,0,0); due.setMilliseconds(0); }
  else if(tm && tm!=='bad') errs.push('有時間但缺到期日');
  return {title, assignees:who.ids, due, errs};
}
function cleanRows(rows){ return rows.map(r=>r.map(c=>typeof c==='string'?c.trim():c)).filter(r=>r.some(c=>c!==''&&c!=null)); }
function textToRows(txt){ const tab=txt.includes('\t');
  return txt.split(/\r?\n/).map(l=>tab?l.split('\t'):l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"'))); }
async function fileToRows(f){ const X=await loadXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array'});
  return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}); }

function buildImport(rows){
  rows=cleanRows(rows);
  if(rows.length && /任務|名稱|title|task/i.test(String(rows[0][0]||''))) rows=rows.slice(1);
  return rows.map(r=>{ const t=parseTaskCells(r); if(!t.title) t.errs.unshift('缺任務名稱'); return t; });
}
// 專案匯入：[專案名稱, 任務名稱, 負責人, 到期日, 到期時間]；專案名稱留空＝沿用上一列
function buildProjectImport(rows){
  rows=cleanRows(rows);
  if(rows.length && /專案|project/i.test(String(rows[0][0]||''))) rows=rows.slice(1);
  const groups=[]; let cur=null;
  rows.forEach(r=>{
    const pn=String(r[0]??'').trim();
    if(pn){ cur=groups.find(g=>g.name===pn); if(!cur){ const ex=st.projects.find(p=>p.name.trim()===pn && !p.archived)||st.projects.find(p=>p.name.trim()===pn);
      cur={name:pn, existing:ex||null, tasks:[], errs:[]}; groups.push(cur); } }
    const hasTask=r.slice(1).some(c=>c!==''&&c!=null);
    if(!cur){ groups.push(cur={name:'', existing:null, tasks:[], errs:['缺專案名稱']}); }
    if(hasTask){ const t=parseTaskCells(r.slice(1)); if(!t.title) t.errs.unshift('缺任務名稱'); cur.tasks.push(t); }
  });
  return groups;
}

function pickedOf(root,name){ return [...root.querySelectorAll(`[data-pick="${name}"] input:checked`)].map(i=>i.value); }
function maxOrder(pid){ return st.tasks.concat(st.trashT||[]).filter(t=>t.project_id===pid).reduce((m,t)=>Math.max(m,+t.sort_order||0),0); }
function orderKey(t){ return t.sort_order!=null ? +t.sort_order : 1e15+(+new Date(t.created_at||0)); }
function bindTaskDrag(box, onDrop){
  box.querySelectorAll('.drag-h').forEach(h=>{
    h.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); const row=h.closest('.rec'); const before=[...box.querySelectorAll('.rec[data-tid]')].map(r=>r.dataset.tid);
      row.classList.add('dragging'); try{ h.setPointerCapture(e.pointerId); }catch(_){}
      const move=ev=>{ const y=ev.clientY; let n=row.nextElementSibling, pr=row.previousElementSibling;
        if(n && n.matches('.rec[data-tid]')){ const r=n.getBoundingClientRect(); if(y>r.top+r.height/2){ box.insertBefore(n,row); return; } }
        if(pr && pr.matches('.rec[data-tid]')){ const r=pr.getBoundingClientRect(); if(y<r.top+r.height/2){ box.insertBefore(row,pr); } } };
      const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); row.classList.remove('dragging'); document.body.classList.remove('no-select');
        const after=[...box.querySelectorAll('.rec[data-tid]')].map(r=>r.dataset.tid); if(after.join()!==before.join()) onDrop(after); };
      document.body.classList.add('no-select');
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); });
    h.addEventListener('click',e=>e.stopPropagation()); });
}

async function toggleTask(t, on, opts={}){

function winsOf(uid){
  const since=Date.now()-7*86400000, wins=[];
  st.sessions.filter(s=>s.user_id===uid && !s.split_of && !s.background && s.end_at && +new Date(s.end_at)>=since && (sessEnd(s)-new Date(s.start_at))>=20*60000).forEach(s=>{
    const dur=sessEnd(s)-new Date(s.start_at);
    wins.push({ref:'session:'+s.id, t:+new Date(s.end_at), icon:'⏱', kind:'session', text:`專注工作 ${zhShort(dur)}`, sub:sessLabel(s), dur:zhShort(dur)}); });
  st.sessions.filter(x=>x.user_id===uid && x.split_of && x.end_at && +new Date(x.end_at)>=since).forEach(x=>{
    const m=st.sessions.find(z=>z.id===x.split_of);
    wins.push({ref:'shun:'+x.id, t:+new Date(x.end_at), icon:'🌱', kind:'shun', text:`順手推進了「${esc(projName(x.project_id))}${taskOf(x.task_id)?' / '+esc(taskOf(x.task_id).title):''}」`, sub:m?`做 ${sessLabel(m)} 的時候`:''}); });
  st.taskDone.filter(d=>d.user_id===uid && +new Date(d.done_at)>=since).forEach(d=>{ const t=taskOf(d.task_id); if(!t) return;
    wins.push({ref:'task:'+t.id, t:+new Date(d.done_at), icon:'✅', kind:'task', text:`完成任務「${esc(t.title)}」`, sub:esc(projName(t.project_id)), title:t.title}); });
  st.projects.filter(p=>!p.archived && projPeople(p).includes(uid)).forEach(p=>KINDS.forEach(([f,k,lbl])=>{
    if(p[f]>0 && goalReached(uid,p,f,k)){ const per=periodOf(k,Date.now(),0,projCut(uid,p.id));
      const last=st.sessions.filter(s=>s.user_id===uid&&s.project_id===p.id).reduce((m,s)=>Math.max(m,sessEnd(s)),0);
      wins.push({ref:`goal:${p.id}:${k}:${per.start.toISOString()}`, t:last, icon:'🎯', kind:'goal', text:`達成「${esc(p.name)}」${lbl}目標 ${+p[f]} 小時`, sub:rangeLabel(k,per)}); } }));
  (st.ach||[]).filter(a=>a.user_id===uid && +new Date(a.created_at)>=since).forEach(a=>{
    wins.push({ref:'ach:'+a.id, t:+new Date(a.created_at), icon:achIcon(a), kind:'ach', gold:true, text:a.kind==='say_do'?'今天說到做到':esc(achText(a)), sub:esc(achSub(a))||'成就'}); });
  return wins.sort((a,b)=>b.t-a.t).slice(0,25);
}

// 檢查這台裝置能不能顯示某個表情（顯示不出來就自動隱藏）
const emojiOK=(()=>{ let cv,ctx,base=null,tofu=null; const cache={};
  function px(e){ ctx.clearRect(0,0,40,40); ctx.fillText(e,2,2); return ctx.getImageData(0,0,40,40).data; }
  function stats(d){ let ink=0,col=0; for(let i=0;i<d.length;i+=4){ if(d[i+3]>50){ ink++; if(Math.abs(d[i]-d[i+1])>25||Math.abs(d[i+1]-d[i+2])>25) col++; } } return {ink,col}; }
  function diff(a,b){ let n=0; for(let i=3;i<a.length;i+=4) if(Math.abs(a[i]-b[i])>60) n++; return n; }
  return e=>{ if(e in cache) return cache[e];
    try{ if(!cv){ cv=document.createElement('canvas'); cv.width=cv.height=40; ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.textBaseline='top';
        ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        base={...stats(px('😀')),w:ctx.measureText('😀').width}; tofu=px('\u{10FFFD}'); }
      if(base.col<20) return cache[e]=true;              // 無法判斷時一律顯示
      const d=px(e), s=stats(d);
      if(s.ink<15) return cache[e]=false;                // 什麼都沒畫出來
      if(ctx.measureText(e).width>base.w*1.6) return cache[e]=false;   // 組合表情被拆成兩個字
      return cache[e]= s.col>20 || diff(d,tofu)>40;      // 有顏色，或至少不是「方框」
    }catch(_){ return cache[e]=true; } }; })();

const poppedIds=new Set();

const TRASH_DAYS=30;
function trashItems(){
  const it=[];
  st.trashP.forEach(p=>it.push({kind:'projects',id:p.id,name:p.name,icon:'📁',sub:'專案',at:p.deleted_at}));
  st.trashT.forEach(t=>it.push({kind:'tasks',id:t.id,name:t.title,icon:'☑️',sub:`任務・${esc(projName(t.project_id))}`,at:t.deleted_at}));
  st.trashS.filter(s=>s.user_id===me.id).forEach(s=>it.push({kind:'sessions',id:s.id,name:`${fmtDT(s.start_at)} ~ ${s.end_at?fmtT(s.end_at):''}`,icon:'⏱',sub:`打卡紀錄・${sessLabel(s)}`,at:s.deleted_at}));
  return it.sort((a,b)=>new Date(b.at)-new Date(a.at));
}
function renderTrash(){
  const it=trashItems();
  $('#view').innerHTML=`${subHeader('🗑️ 垃圾桶')}
    <p class="hint" style="margin:0 4px 10px">刪除的專案、任務、打卡紀錄會保留 ${TRASH_DAYS} 天，期間可以復原；之後會自動永久刪除。</p>
    ${it.length?`<div class="card list">${it.map(x=>{ const left=Math.max(0,TRASH_DAYS-Math.floor((Date.now()-new Date(x.at))/86400000));
      return `<div class="rec"><span class="me-ic">${x.icon}</span><div class="main"><b>${esc(x.name)}</b><div class="meta">${x.sub}・${ago(x.at)}刪除・剩 ${left} 天</div></div>
        <div class="row" style="gap:6px;flex:none"><button class="btn sm" data-rs="${x.kind}|${x.id}">復原</button><button class="btn sm danger-ghost" data-pg="${x.kind}|${x.id}">永久刪除</button></div></div>`; }).join('')}</div>`
      :`<div class="card empty">垃圾桶是空的</div>`}`;
  bindSubBack();
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{ const [k,id]=b.dataset.rs.split('|'); await restoreItem(k,id); });
  document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=async()=>{ const [k,id]=b.dataset.pg.split('|');
    if(!confirm(k==='projects'?'永久刪除這個專案？它的子任務也會一起永久刪除，無法再復原。':'永久刪除？刪除後就無法復原。')) return;
    const {error}=await sb.from(k).delete().eq('id',id); if(error) return toast('刪除失敗'); await loadAll(); render(); toast('已永久刪除'); });
}
async function restoreItem(kind,id){
  const {error}=await sb.from(kind).update({deleted_at:null}).eq('id',id); if(error) return toast('復原失敗');
  if(kind==='sessions'){ await sb.from('sessions').update({deleted_at:null}).eq('split_of',id); await tomAdjust(id,1); }
  await loadAll();
  if(kind==='sessions'){ const x=st.sessions.find(z=>z.id===id); if(x&&x.split_of) await recalcShare(x.split_of); }
  render(); toast('已復原 ✓');
}
async function tomAdjust(sid,sign){ const t=prof(me.id)?.tomatoes; if(!t||!t.s||!t.s[sid]) return; const [dk,c,gone]=t.s[sid];
  if(sign<0 && gone) return; if(sign>0 && !gone) return;
  const v={...t,h:{...(t.h||{})},s:{...t.s}}; v.h[dk]=Math.max(0,(v.h[dk]||0)+sign*c); if(v.d===dk) v.n=Math.max(0,(v.n||0)+sign*c);
  v.s[sid]=sign<0?[dk,c,1]:[dk,c]; prof(me.id).tomatoes=v; await W({t:'profiles',k:'update',row:{tomatoes:v},m:{id:me.id}}); }
async function softDelete(kind,id,label){
  const patch={deleted_at:new Date().toISOString()};
  if(kind==='sessions'){ const s=st.sessions.find(x=>x.id===id); if(s && !s.end_at) patch.end_at=patch.deleted_at; }
  const ex=kind==='sessions'?st.sessions.find(x=>x.id===id):null;
  const {error}=await sb.from(kind).update(patch).eq('id',id); if(error){ toast('刪除失敗'); return false; }
  if(kind==='sessions'){ await sb.from('sessions').update({deleted_at:patch.deleted_at}).eq('split_of',id); await tomAdjust(id,-1); }
  if(kind==='projects' && st.projView===id) st.projView=null;
  await loadAll(); if(ex && ex.split_of) await recalcShare(ex.split_of); render();
  toastUndo(`已刪除「${esc(label)}」`, ()=>restoreItem(kind,id));
  return true;
}
// 主要紀錄的比例＝100% 減去同時段（非背景）的比例
async function recalcShare(mainId){
  const m=st.sessions.find(x=>x.id===mainId); if(!m) return;
  const used=st.sessions.filter(x=>x.split_of===mainId && !x.background).reduce((t,x)=>t+Math.round(+x.share*100),0);
  const sh=Math.max(10,100-used)/100; if(Math.abs((+m.share||1)-sh)>0.001){ await sb.from('sessions').update({share:sh}).eq('id',mainId); await loadSessions(); }
}
function toastUndo(msg, onUndo, sub, ms){
  const t=$('#toast'); t.innerHTML=`<span>${msg}</span><button class="undo-btn">復原</button><span class="undo-sub">${sub===undefined?'也可以在「我的 → 垃圾桶」找回':sub}</span>`;
  t.classList.add('show','with-btn'); clearTimeout(toast._t);
  t.querySelector('.undo-btn').onclick=()=>{ t.classList.remove('show','with-btn'); onUndo(); };
  toast._t=setTimeout(()=>t.classList.remove('show','with-btn'),ms||6000);
}
async function purgeTrash(){
  const cut=new Date(Date.now()-TRASH_DAYS*86400000).toISOString();
  for(const k of ['sessions','tasks','projects']){ try{ await sb.from(k).delete().lt('deleted_at',cut); }catch(e){} }
}
// ---- 通用：長按 ----
function bindLongPress(el, fn){
  let t=null, sx=0, sy=0, fired=false;
  el.addEventListener('pointerdown',e=>{ fired=false; sx=e.clientX; sy=e.clientY; t=setTimeout(()=>{ t=null; fired=true; if(navigator.vibrate) try{navigator.vibrate(15);}catch(_){} fn(); },450); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{ if(t){ clearTimeout(t); t=null; } }));
  el.addEventListener('pointermove',e=>{ if(t && (Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){ clearTimeout(t); t=null; } });
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); fired=true; fn(); });
  el.addEventListener('click',e=>{ if(fired){ e.stopImmediatePropagation(); e.preventDefault(); fired=false; } },true);
}

    bindDueQuick(el);
    el.querySelector('#tS').onclick=async()=>{ const title=el.querySelector('#tN').value.trim(); if(!title) return toast('請輸入任務名稱');
      const assignees=pickedOf(el,'tA'), dv=el.querySelector('#tD').value;
      const t2={...t,assignees}; const done=assignees.length?assignees.every(u=>doneBy(t2,u)):!!t.done;
      const {error}=await sb.from('tasks').update({title,assignees,due_at:dv?new Date(dv).toISOString():null,done}).eq('id',t.id);
      if(error) return toast('儲存失敗'); await loadTasks(); close(); render(); toast('已儲存'); };
    const r=el.querySelector('#tRem'); if(r) r.onclick=()=>{ close(); openRemindModal(t.title, due, `${projName(t.project_id)}・Work Together`); };
    el.querySelector('#tDel').onclick=async()=>{ close(); await softDelete('tasks',t.id,t.title); };
  });
}
function openProjectModal(p){
  const isNew=!p; let trows=[{title:'',assignees:[me.id],due:null}];
  modal(`<h3>${isNew?'新增專案':'編輯專案'}</h3>
    <label class="f">專案名稱</label><input id="pN" type="text" ${AC} maxlength="30" value="${esc(p?.name||'')}" placeholder="例如：A 專案">
    <label class="f">負責人（可複選；都不勾＝兩人共用）</label>${assigneePicker('pA',p?projAssignees(p):[me.id])}
    <label class="f">專案期限（選填，含時間）</label><input id="pD" type="datetime-local" ${AC} value="${toInputM(p?projDeadline(p):null)}">${dueQuickHTML('pD')}
    <label class="f">每人時數目標（可勾選一種或多種）</label>
    ${KINDS.map(([f,,,l])=>`<div class="goal-set"><input type="checkbox" id="c_${f}" ${p&&p[f]>0?'checked':''}><span class="lbl">${l}</span>
      <input type="number" id="v_${f}" ${AC} min="0" step="0.5" inputmode="decimal" placeholder="小時" value="${p&&p[f]>0?+p[f]:''}"></div>`).join('')}
    ${isNew?`<label class="f">子任務（選填，可先留空，之後在專案裡新增）</label>
      <div id="ptRows"></div>
      <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm ghost" id="ptAdd" style="flex:1">＋ 新增一列</button><button class="btn sm ghost" id="ptPaste" style="flex:1">📋 從 Excel 貼上</button></div>
      <div id="ptPasteBox" class="hidden"><textarea id="ptTxt" rows="4" ${AC} placeholder="欄位：任務名稱｜負責人｜到期日｜到期時間（在 Excel 選取後複製貼上）"></textarea>
        <div class="row" style="justify-content:space-between;margin-top:6px"><span class="hint" id="ptMsg" style="margin:0"></span><button class="btn sm" id="ptAddPaste">加入清單</button></div></div>`:''}
    ${isNew?'':`<div class="goal-set" style="margin-top:16px"><input type="checkbox" id="pArc" ${p.archived?'checked':''}><span>封存（不再出現在打卡選單）</span></div>`}
    <div class="actions">${isNew?'':'<button class="btn danger-ghost" id="pDel">刪除</button>'}<button class="btn" id="pS">儲存</button></div>`,(el,close)=>{
    bindDueQuick(el);
    KINDS.forEach(([f])=>{ const c=el.querySelector('#c_'+f), v=el.querySelector('#v_'+f);
      v.oninput=()=>{ c.checked=+v.value>0; }; c.onchange=()=>{ if(c.checked) v.focus(); }; });
    const drawRows=()=>{ const box=el.querySelector('#ptRows'); if(!box) return;
      box.innerHTML=trows.map((t,i)=>`<div class="pt-row" data-i="${i}">
        <div class="row" style="gap:6px"><span class="pt-n">${i+1}</span><input class="pt-t" type="text" ${AC} maxlength="60" placeholder="子任務名稱" value="${esc(t.title)}"><button class="pt-x" title="刪除這列">×</button></div>
        <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;padding-left:26px">${people().map(u=>`<button class="pk-mini ${t.assignees.includes(u)?'on':''}" data-u="${u}" style="--c:${colorOf(u)}">${esc(nameOf(u))}</button>`).join('')}
          <input class="pt-d" type="datetime-local" ${AC} value="${toInputM(t.due)}" title="到期時間（選填）"></div></div>`).join('');
      box.querySelectorAll('.pt-row').forEach(r=>{ const t=trows[+r.dataset.i];
        r.querySelector('.pt-t').oninput=e=>{ t.title=e.target.value; };
        r.querySelector('.pt-t').onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); trows.splice(+r.dataset.i+1,0,{title:'',assignees:[...t.assignees],due:null}); drawRows(); el.querySelectorAll('.pt-t')[+r.dataset.i+1].focus(); } };
        r.querySelector('.pt-d').onchange=e=>{ t.due=e.target.value?new Date(e.target.value):null; };
        r.querySelector('.pt-x').onclick=()=>{ trows.splice(+r.dataset.i,1); if(!trows.length) trows.push({title:'',assignees:[me.id],due:null}); drawRows(); };
        r.querySelectorAll('.pk-mini').forEach(b=>b.onclick=()=>{ const u=b.dataset.u; t.assignees=t.assignees.includes(u)?t.assignees.filter(x=>x!==u):[...t.assignees,u]; b.classList.toggle('on'); }); }); };
    if(isNew){ drawRows();
      el.querySelector('#ptAdd').onclick=()=>{ const last=trows[trows.length-1]; trows.push({title:'',assignees:last?[...last.assignees]:[me.id],due:null}); drawRows(); const ins=el.querySelectorAll('.pt-t'); ins[ins.length-1].focus(); };
      el.querySelector('#ptPaste').onclick=()=>{ el.querySelector('#ptPasteBox').classList.toggle('hidden'); el.querySelector('#ptTxt').focus(); };
      el.querySelector('#ptAddPaste').onclick=()=>{ const parsed=buildImport(textToRows(el.querySelector('#ptTxt').value)); const ok=parsed.filter(r=>!r.errs.length);
        if(!ok.length) return toast('沒有可加入的任務，請確認欄位順序');
        trows=trows.filter(t=>t.title.trim()).concat(ok.map(r=>({title:r.title,assignees:r.assignees,due:r.due}))); drawRows();
        el.querySelector('#ptTxt').value=''; el.querySelector('#ptPasteBox').classList.add('hidden');
        toast(`已加入 ${ok.length} 個任務${parsed.length>ok.length?`，${parsed.length-ok.length} 筆格式有誤已略過`:''}`); }; }
    el.querySelector('#pS').onclick=async()=>{
      const name=el.querySelector('#pN').value.trim(); if(!name) return toast('請輸入專案名稱');
      const dv=el.querySelector('#pD').value;
      const row={name,assignees:pickedOf(el,'pA'),deadline_at:dv?new Date(dv).toISOString():null,deadline:null};
      for(const [f,,,l] of KINDS){ const on=el.querySelector('#c_'+f).checked, v=+el.querySelector('#v_'+f).value;
        if(on && !(v>0)) return toast(`請填入${l}目標時數`); row[f]=on?v:null; }
      if(!isNew) row.archived=el.querySelector('#pArc').checked;
      if(isNew) row.id=uuid();
      const btn=el.querySelector('#pS'); btn.disabled=true;
      const {error}=isNew?await sb.from('projects').insert(row):await sb.from('projects').update(row).eq('id',p.id);
      if(error){ btn.disabled=false; return toast('儲存失敗'); }
      let nt=0;
      if(isNew){ const ts=trows.filter(t=>t.title.trim()).map((t,i)=>({project_id:row.id,title:t.title.trim().slice(0,60),assignees:t.assignees,due_at:t.due?t.due.toISOString():null,sort_order:(i+1)*1000}));
        if(ts.length){ const r=await sb.from('tasks').insert(ts); if(r.error) toast('專案已建立，但子任務新增失敗'); else nt=ts.length; } }
      await Promise.all([loadProjects(),loadTasks()]); close();
      if(isNew){ st.tab='proj'; st.projView=row.id; }
      render(); toast(isNew?`已建立專案${nt?`和 ${nt} 個子任務`:''} ✓`:'已儲存');
    };
    const del=el.querySelector('#pDel');
    if(del) del.onclick=async()=>{ close(); await softDelete('projects',p.id,p.name); };
  });
}

// ===================== PWA =====================
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
boot();
</script>
