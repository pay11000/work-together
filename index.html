<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工時同步">
<title>工時同步</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1d2129; --sub:#6b7280; --line:#e6e8ec;
  --accent:#2f9e8f; --accent-soft:#e3f3f0; --danger:#d9534f; --track:#eceef1;
  --p0:#2f9e8f; --p1:#e07a5f; --p2:#6c7bd9; --p3:#c9a227;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#111317; --card:#1b1e24; --text:#eceef2; --sub:#9aa1ad; --line:#2a2e36;
    --accent:#3bb5a3; --accent-soft:#1d3532; --track:#2a2e36; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
header .date{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.h2{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px;letter-spacing:.5px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{position:relative;overflow:hidden}
.person .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sub)}
.dot.on{animation:pulse 1.6s infinite;color:inherit}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,143,.55)}70%{box-shadow:0 0 0 7px rgba(47,158,143,0)}100%{box-shadow:0 0 0 0 rgba(47,158,143,0)}}
.person .state{font-size:12px;color:var(--sub);margin-top:2px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;margin:6px 0 4px;letter-spacing:.5px}
.person .timer.off{color:var(--sub);font-size:18px;font-weight:600}
.person .tot{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.person .bar-top{position:absolute;left:0;top:0;right:0;height:3px}
.me-tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-weight:500}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px}
.btn.stop{background:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger-ghost{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=url]{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);
  font-size:15px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.clock-live{text-align:center;margin-bottom:12px}
.clock-live .big-t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock-live .since{color:var(--sub);font-size:13px}
.proj{padding:14px 16px}
.proj-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.proj-name{font-weight:700}
.goal{margin-top:10px}
.goal-label{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.prow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.prow .who{width:54px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{flex:1;height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
.prow .val{width:112px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px}
.prow .val b{color:var(--text);font-weight:600}
.done{color:var(--accent)!important}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:14px}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{padding:9px 10px;font-size:14px}
.day-h{font-size:12px;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.rec{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .main{flex:1;min-width:0}
.rec .range{font-variant-numeric:tabular-nums;font-size:14px}
.rec .meta{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .dur{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.rec.mine{cursor:pointer}
.list{padding:0;overflow:hidden}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--sub);font-size:11px;font-family:inherit;cursor:pointer}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav button.act{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .actions{display:flex;gap:10px;margin-top:20px}
.modal .actions .btn{flex:1}
.goal-set{display:flex;align-items:center;gap:10px;margin-top:10px}
.goal-set input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.goal-set .lbl{width:44px}
.goal-set input[type=number]{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:.95}
.center-box{max-width:400px;margin:10vh auto 0;padding:0 16px}
.logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
.hint{font-size:12px;color:var(--sub);margin-top:8px}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.tap{cursor:pointer}
.task .chk{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.strike{text-decoration:line-through;color:var(--sub)}
.dot.sm{width:7px;height:7px;display:inline-block;margin-right:4px;vertical-align:middle}
.due{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--track);color:var(--sub);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.due.near{background:#fff3d6;color:#9a6b00}.due.soon{background:#ffe3d6;color:#c2501f}.due.over{background:#fde0df;color:var(--danger);font-weight:600}.due.ok{text-decoration:line-through}
@media (prefers-color-scheme:dark){.due.near{background:#3a3020;color:#e6b84a}.due.soon{background:#3d2a22;color:#f08a5d}.due.over{background:#3d2323;color:#ff7b76}}
.tag.gray{background:var(--track);color:var(--sub)}
.track.thin{height:5px;margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv>span:first-child{color:var(--sub);flex:none}.kv>span:last-child{text-align:right}
.lnk{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.sub-r{font-size:11px;color:var(--sub);margin:-2px 0 0 62px}
.lbl-s{font-size:12px;color:var(--sub)}
.meta-i{font-size:12px;color:var(--sub);margin-left:4px}
.seg label{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.seg input{accent-color:var(--accent);margin-right:6px}
input[type=time],input[type=date]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sw.sel{border-color:var(--text)}
.swatch-cur{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ===================== 基本設定 =====================
const DEF_CUT = { m: 360, wd: 1 };   // 預設：每天 06:00 起算、每週從週一起算（每人可在「設定」改，各專案可另設）
const CFG_KEY = 'wt_cfg';
const LAST_PROJ_KEY = 'wt_last_project';
const COLORS = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SWATCHES = ['#2f9e8f','#e07a5f','#6c7bd9','#c9a227','#d6589f','#3d8bd9','#7a9e3b','#8e6cc9','#e0563b','#5f6b7a'];
const WD = ['日','一','二','三','四','五','六'];

// ===================== 小工具 =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }
function hms(ms){ ms=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(ms/3600)}:${pad(Math.floor(ms%3600/60))}:${pad(ms%60)}`; }
function zhDur(ms){ ms=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60; return `${h} 小時 ${m} 分 ${s} 秒`; }
function zhShort(ms){ ms=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60); return h?`${h} 小時 ${m} 分`:`${m} 分`; }
function hrs(ms){ return ms/3600000; }
function fmtHrs(ms){ const h=hrs(ms); return h>=100?h.toFixed(0):h.toFixed(1); }
function fmtDT(d){ d=new Date(d); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtT(d){ d=new Date(d); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtFull(d){ d=new Date(d); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${fmtT(d)}`; }
function toInput(d){ d=new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${fmtT(d)}`; }
function minToHM(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function hmToMin(s){ const [h,m]=String(s||'').split(':').map(Number); return (h||0)*60+(m||0); }
function cutText(c){ return `每天 ${minToHM(c.m)} 起算・每週從週${WD[c.wd]}開始`; }
function dateMD(s){ const [y,m,d]=String(s).split('-').map(Number); return `${m}/${d}`; }
function dateYMD(s){ const [y,m,d]=String(s).split('-').map(Number); return `${y}/${m}/${d}`; }
// 距離某個日期（當天 23:59:59 截止）還有幾天
function daysLeft(s){ const [y,m,d]=String(s).split('-').map(Number); const t=new Date(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.round((new Date(y,m-1,d)-today)/86400000); }
function dueBadge(s, done){
  if(!s) return ''; if(done) return `<span class="due ok">${dateMD(s)}</span>`;
  const n=daysLeft(s); const cls=n<0?'over':n<=3?'soon':n<=7?'near':'';
  const txt=n<0?`逾期 ${-n} 天`:n===0?'今天到期':`剩 ${n} 天`;
  return `<span class="due ${cls}">${dateMD(s)}・${txt}</span>`;
}

// ---- 期間計算（依切點）----
function shifted(t,c){ return new Date(+new Date(t) - c.m*60000); }
function atCut(y,mo,d,c){ return new Date(y,mo,d,0,c.m,0,0); }
function periodOf(kind, t=Date.now(), offset=0, c=DEF_CUT){
  const s=shifted(t,c); let a,b;
  if(kind==='day'){ a=atCut(s.getFullYear(),s.getMonth(),s.getDate()+offset,c); b=atCut(s.getFullYear(),s.getMonth(),s.getDate()+offset+1,c); }
  else if(kind==='week'){ const back=(s.getDay()-c.wd+7)%7; const d0=s.getDate()-back+offset*7; a=atCut(s.getFullYear(),s.getMonth(),d0,c); b=atCut(s.getFullYear(),s.getMonth(),d0+7,c); }
  else { a=atCut(s.getFullYear(),s.getMonth()+offset,1,c); b=atCut(s.getFullYear(),s.getMonth()+offset+1,1,c); }
  return {start:a,end:b};
}
function workDateKey(t,c){ const s=shifted(t,c); return `${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`; }
function sessEnd(s){ return s.end_at ? +new Date(s.end_at) : Date.now(); }
function overlapMs(s,p){ const a=Math.max(+new Date(s.start_at),+p.start), b=Math.min(sessEnd(s),+p.end); return Math.max(0,b-a); }
function sumMs(list,p){ return list.reduce((t,s)=>t+overlapMs(s,p),0); }
function rangeLabel(kind,p){ const last=new Date(+p.end-86400000);
  return kind==='day'?`${p.start.getMonth()+1}/${p.start.getDate()}`:`${p.start.getMonth()+1}/${p.start.getDate()} – ${last.getMonth()+1}/${last.getDate()}`; }

// ===================== 狀態 =====================
let sb=null, me=null;
const st = { profiles:[], projects:[], sessions:[], tasks:[], pus:[], tab:'home', projView:null, showDone:false, recWho:'all', recRange:'week' };

function cfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch{ return null; } }
function prof(uid){ return st.profiles.find(p=>p.id===uid); }
function colorOf(uid){ const pc=prof(uid)?.color; if(pc) return pc; const ids=[...new Set([...st.profiles.map(p=>p.id), me?.id].filter(Boolean))].sort(); const i=ids.indexOf(uid); return COLORS[(i<0?0:i)%COLORS.length]; }
function nameOf(uid){ return prof(uid)?.name || (uid===me?.id ? '我' : '對方'); }
function projOf(pid){ return st.projects.find(p=>p.id===pid); }
function projName(pid){ return projOf(pid)?.name || '未指定專案'; }
function taskOf(tid){ return st.tasks.find(t=>t.id===tid); }
function people(){ const ids=st.profiles.map(p=>p.id); if(me && !ids.includes(me.id)) ids.push(me.id); return ids.sort((a,b)=>(a===me.id?-1:b===me.id?1:0)); }
function openOf(uid){ return st.sessions.find(s=>s.user_id===uid && !s.end_at); }
function userCut(uid){ const p=prof(uid); return p ? {m:p.day_start_min??DEF_CUT.m, wd:p.week_start_day??DEF_CUT.wd} : DEF_CUT; }
function projOverride(uid,pid){ return st.pus.find(x=>x.user_id===uid && x.project_id===pid); }
function projCut(uid,pid){ const o=projOverride(uid,pid); return o ? {m:o.day_start_min, wd:o.week_start_day} : userCut(uid); }
function sessLabel(s){ const t=taskOf(s.task_id); return esc(projName(s.project_id)) + (t?` / ${esc(t.title)}`:''); }

// ===================== 啟動 =====================
(function readSetupLink(){
  const m=location.hash.match(/setup=([^&]+)/);
  if(m){ try{ const c=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
      if(c.u && c.k) localStorage.setItem(CFG_KEY, JSON.stringify({url:c.u,key:c.k})); }catch(e){}
    history.replaceState(null,'',location.pathname); }
})();

async function boot(){
  const c=cfg();
  if(!c) return renderSetup();
  try{ sb=window.supabase.createClient(c.url,c.key); }catch(e){ return renderSetup('連線設定有誤：'+e.message); }
  const {data}=await sb.auth.getSession();
  if(!data.session) return renderLogin();
  me=data.session.user; await startApp();
}

function renderSetup(err){
  $('#app').innerHTML=`<div class="center-box">
    <img class="logo" src="icon-192.png" alt="">
    <h2 style="text-align:center;margin:0 0 4px">工時同步・首次設定</h2>
    <p class="hint" style="text-align:center">貼上 Supabase 的連線資訊（只需設定一次）。<br>另一個人可直接用你在「設定」頁分享的連結，免填。</p>
    <div class="card">
      <label class="f">Project URL</label><input id="cu" type="url" placeholder="https://xxxx.supabase.co">
      <label class="f">Publishable key（或 anon public key）</label><input id="ck" type="text" placeholder="sb_publishable_… 或 eyJ…">
      ${err?`<p style="color:var(--danger);font-size:13px">${esc(err)}</p>`:''}
      <button class="btn big" style="margin-top:16px" id="cs">儲存</button>
    </div></div>`;
  $('#cs').onclick=()=>{ const url=$('#cu').value.trim().replace(/\/+$/,''), key=$('#ck').value.trim();
    if(!/^https:\/\/.+/.test(url)||!key) return toast('請填入兩個欄位');
    localStorage.setItem(CFG_KEY,JSON.stringify({url,key})); boot(); };
}

function renderLogin(){
  $('#app').innerHTML=`<div class="center-box">
    <img class="logo" src="icon-192.png" alt="">
    <h2 style="text-align:center;margin:0 0 16px">工時同步</h2>
    <div class="card">
      <label class="f">Email</label><input id="le" type="email" autocomplete="username">
      <label class="f">密碼</label><input id="lp" type="password" autocomplete="current-password">
      <button class="btn big" style="margin-top:16px" id="lb">登入</button>
    </div>
    <p class="hint" style="text-align:center"><a href="#" id="reset" style="color:var(--sub)">重新設定連線</a></p></div>`;
  const go=async()=>{ $('#lb').disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
    $('#lb').disabled=false;
    if(error) return toast('登入失敗：帳號或密碼錯誤');
    me=data.user; await startApp(); };
  $('#lb').onclick=go; $('#lp').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#reset').onclick=e=>{ e.preventDefault(); localStorage.removeItem(CFG_KEY); renderSetup(); };
}

// ===================== 資料 =====================
async function loadProfiles(){ const {data,error}=await sb.from('profiles').select('*'); if(!error) st.profiles=data||[]; }
async function loadProjects(){ const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:true}); if(!error) st.projects=data||[]; }
async function loadTasks(){ const {data,error}=await sb.from('tasks').select('*').order('created_at',{ascending:true}); if(!error) st.tasks=data||[]; }
async function loadPus(){ const {data,error}=await sb.from('project_user_settings').select('*'); if(!error) st.pus=data||[]; }
async function loadSessions(){
  const since=new Date(Date.now()-430*86400000).toISOString(); let all=[],from=0;
  while(true){
    const {data,error}=await sb.from('sessions').select('*').gte('start_at',since).order('start_at',{ascending:false}).range(from,from+999);
    if(error){ toast('讀取紀錄失敗'); break; }
    all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000;
  }
  st.sessions=all;
}
const LOADERS={profiles:loadProfiles,projects:loadProjects,tasks:loadTasks,project_user_settings:loadPus,sessions:loadSessions};
async function loadAll(){ await Promise.all(Object.values(LOADERS).map(f=>f())); }

const pending=new Set(); let reloadT=null;
function scheduleReload(which){
  pending.add(which); clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{
    const ws=[...pending]; pending.clear();
    if(ws.includes('all')) await loadAll(); else await Promise.all(ws.map(w=>LOADERS[w]()));
    if(!document.querySelector('.modal-bg')) render();
  },300);
}

let channel=null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('wt-sync');
  Object.keys(LOADERS).forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>scheduleReload(t)));
  channel.subscribe();
}

async function startApp(){
  $('#app').innerHTML=`<div class="wrap"><div class="empty">載入中…</div></div>`;
  await loadAll();
  if(!prof(me.id)){
    await sb.from('profiles').upsert({id:me.id,name:(me.email||'').split('@')[0]}); await loadProfiles();
    setTimeout(()=>openNameModal(true),300);
  }
  subscribe(); render();
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'){ me=null; renderLogin(); } });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && me){ subscribe(); scheduleReload('all'); } });
  setInterval(tick,1000);
}

const KINDS=[['daily_hours','day','今日','每日'],['weekly_hours','week','本週','每週'],['monthly_hours','month','本月','每月']];
function goalBlock(p){
  return KINDS.filter(([f])=>p[f]>0).map(([f,k,lbl])=>{
    const goal=+p[f]*3600000, myP=periodOf(k,Date.now(),0,projCut(me.id,p.id));
    return `<div class="goal"><div class="goal-label"><span>${lbl} 目標 ${+p[f]} 小時</span><span>${rangeLabel(k,myP)}</span></div>
      ${people().map(uid=>{ const per=periodOf(k,Date.now(),0,projCut(uid,p.id));
        const ms=sumMs(st.sessions.filter(s=>s.user_id===uid && s.project_id===p.id),per), pct=Math.min(100,ms/goal*100), ok=ms>=goal;
        const diff=uid!==me.id && (+per.start!==+myP.start) ? `<div class="sub-r">${rangeLabel(k,per)}（依${esc(nameOf(uid))}的切點）</div>`:'';
        return `<div class="prow"><span class="who">${esc(nameOf(uid))}</span><div class="track"><div class="fill" style="width:${pct}%;background:${colorOf(uid)}"></div></div>
          <span class="val ${ok?'done':''}"><b class="${ok?'done':''}">${fmtHrs(ms)}</b> / ${+p[f]} 時${ok?' ✓':''}</span></div>${diff}`; }).join('')}
    </div>`; }).join('');
}
function progressHTML(ps){
  ps=ps.filter(p=>KINDS.some(([f])=>p[f]>0) || p.deadline);
  if(!ps.length) return `<div class="card empty">還沒有設定時數目標或死限的專案<br><button class="btn sm ghost" style="margin-top:10px" onclick="st.tab='proj';render()">去設定專案</button></div>`;
  return ps.map(p=>{ const ts=st.tasks.filter(t=>t.project_id===p.id), dn=ts.filter(t=>t.done).length;
    return `<div class="card proj tap" data-open="${p.id}"><div class="proj-head"><span class="proj-name">${esc(p.name)}</span>${p.deadline?dueBadge(p.deadline):''}</div>
    ${ts.length?`<div class="goal-label" style="margin-top:2px"><span>任務 ${dn}/${ts.length} 完成</span></div><div class="track thin"><div class="fill" style="width:${dn/ts.length*100}%;background:var(--accent)"></div></div>`:''}
    ${goalBlock(p)}</div>`; }).join('');
}

function upcomingHTML(){
  const items=[];
  st.projects.filter(p=>!p.archived && p.deadline && daysLeft(p.deadline)<=7).forEach(p=>items.push({d:p.deadline,html:`<b>${esc(p.name)}</b> 專案死限`,pid:p.id}));
  st.tasks.filter(t=>!t.done && t.due && daysLeft(t.due)<=7 && projOf(t.project_id) && !projOf(t.project_id).archived && (!t.assignee||t.assignee===me.id))
    .forEach(t=>items.push({d:t.due,html:`${esc(t.title)} <span class="meta-i">${esc(projName(t.project_id))}</span>`,pid:t.project_id}));

const RANGES=[['week','本週'],['lastweek','上週'],['month','本月'],['lastmonth','上月'],['all','全部']];
function recPeriod(){ const r=st.recRange, c=userCut(me.id);
  if(r==='week') return periodOf('week',Date.now(),0,c); if(r==='lastweek') return periodOf('week',Date.now(),-1,c);
  if(r==='month') return periodOf('month',Date.now(),0,c); if(r==='lastmonth') return periodOf('month',Date.now(),-1,c);
  return {start:new Date(0),end:new Date(8.64e15)}; }
function recList(){ const p=recPeriod();
  return st.sessions.filter(s=>(st.recWho==='all'||s.user_id===st.recWho) && (overlapMs(s,p)>0 || (!s.end_at && +new Date(s.start_at)>=+p.start && +new Date(s.start_at)<+p.end)))
    .sort((a,b)=>new Date(b.start_at)-new Date(a.start_at)); }

function renderRecords(){
  const list=recList(), p=recPeriod(), c=userCut(me.id);
  const groups={}; list.forEach(s=>{ const k=workDateKey(s.start_at,c); (groups[k]=groups[k]||[]).push(s); });
  const total=list.reduce((t,s)=>t+overlapMs(s,p),0);
  $('#view').innerHTML=`<div class="filters">
      <select id="fw"><option value="all">全部人員</option>${people().map(u=>`<option value="${u}" ${st.recWho===u?'selected':''}>${esc(nameOf(u))}</option>`).join('')}</select>

      <span class="row" style="gap:6px"><button class="btn sm ghost" id="exp">匯出 Excel</button><button class="btn sm" id="add">＋ 補登</button></span></div>
    ${list.length?Object.keys(groups).map(k=>{ const [y,m,d]=k.split('-').map(Number), dd=new Date(y,m-1,d);
      const dayTot=groups[k].reduce((t,s)=>t+(sessEnd(s)-new Date(s.start_at)),0);
      return `<div class="day-h"><span>${m}/${d}（${WD[dd.getDay()]}）</span><span>${zhShort(dayTot)}</span></div>
      <div class="card list">${groups[k].map(s=>{ const mine=s.user_id===me.id;
        const sameDay=s.end_at && new Date(s.end_at).toDateString()===new Date(s.start_at).toDateString();
        return `<div class="rec ${mine?'tap':''}" data-id="${s.id}"><span class="dot" style="background:${colorOf(s.user_id)}"></span>
          <div class="main"><div class="range">${fmtT(s.start_at)} ~ ${s.end_at?(sameDay?fmtT(s.end_at):fmtDT(s.end_at)):'<span style="color:var(--accent)">進行中</span>'}</div>
          <div class="meta">${esc(nameOf(s.user_id))}・${sessLabel(s)}${s.note?'・'+esc(s.note):''}</div></div>
          <div class="dur">${s.end_at?zhDur(sessEnd(s)-new Date(s.start_at)).replace(/ /g,''):`<span data-since="${+new Date(s.start_at)}">${hms(Date.now()-new Date(s.start_at))}</span>`}</div></div>`; }).join('')}</div>`; }).join('')
      :`<div class="card empty">這段期間沒有紀錄</div>`}
    <p class="hint" style="text-align:center">點自己的紀錄可修改或刪除・期間依「我的預設切點」（${cutText(c)}）</p>`;
  $('#fw').onchange=e=>{ st.recWho=e.target.value; renderRecords(); };
  $('#fr').onchange=e=>{ st.recRange=e.target.value; renderRecords(); };
  $('#add').onclick=()=>openSessionModal(null);

function exportCSV(){
  const list=recList().slice().reverse();
  const rows=[['人員','專案','任務','開始','結束','時長','小時數','備註']].concat(list.map(s=>{ const ms=sessEnd(s)-new Date(s.start_at);
    return [nameOf(s.user_id),projName(s.project_id),taskOf(s.task_id)?.title||'',fmtFull(s.start_at),s.end_at?fmtFull(s.end_at):'進行中',zhDur(ms),hrs(ms).toFixed(2),s.note||'']; }));
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const lbl=RANGES.find(r=>r[0]===st.recRange)[1], d=new Date();
  a.download=`工時紀錄_${lbl}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`; a.click();
}

    const {error}=await sb.from('tasks').update({done:el.checked}).eq('id',el.dataset.chk); if(error) return toast('更新失敗');
    await loadTasks(); renderProjectDetail(); if(el.checked) toast('任務完成 ✓'); }; });
  document.querySelectorAll('[data-tid]').forEach(el=>el.onclick=()=>openTaskModal(taskOf(el.dataset.tid)));
}

// ===================== 設定 =====================
function renderSettings(){
  const c=cfg(), mc=userCut(me.id);
  $('#view').innerHTML=`<div class="card">
      <div class="set-item"><div><div class="lbl-s">我的顯示名稱</div><div style="font-weight:600">${esc(nameOf(me.id))}</div></div><button class="btn sm ghost" id="nm">修改</button></div>
      <div class="set-item"><div><div class="lbl-s">我的代表色</div><div class="row" style="gap:6px;margin-top:2px"><span class="swatch-cur" style="background:${colorOf(me.id)}"></span><span class="hint" style="margin:0">顯示在狀態卡、進度條與紀錄</span></div></div><button class="btn sm ghost" id="clr">修改</button></div>
      <div class="set-item"><div><div class="lbl-s">我的預設切點</div><div>${cutText(mc)}</div><div class="hint" style="margin:2px 0 0">每月皆從 1 號的這個時間起算；各專案可另外設定</div></div><button class="btn sm ghost" id="cut">修改</button></div>
      <div class="set-item"><div><div class="lbl-s">登入帳號</div><div>${esc(me.email||'')}</div></div><button class="btn sm danger-ghost" id="lo">登出</button></div>
    </div>
    <div class="card"><div style="font-weight:600">邀請另一個人</div>
      <p class="hint">把這個連結傳給對方，打開後就不用自己填連線資訊，直接用他的帳號密碼登入即可。</p>
      <button class="btn ghost" style="width:100%" id="share">複製設定連結</button></div>
    <div class="card"><div style="font-weight:600">加到手機主畫面</div>
      <p class="hint" style="margin-bottom:0">iPhone：Safari 下方「分享」→「加入主畫面」<br>Android：Chrome 右上「⋮」→「安裝應用程式」或「加到主畫面」</p></div>`;
  $('#nm').onclick=()=>openNameModal(false);
  $('#cut').onclick=()=>openCutModal(null);
  $('#clr').onclick=openColorModal;
  $('#lo').onclick=async()=>{ if(confirm('確定要登出？')){ await sb.auth.signOut(); me=null; renderLogin(); } };
  $('#share').onclick=async()=>{
    const token=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({u:c.url,k:c.key})))));
    const url=location.origin+location.pathname+'#setup='+token;
    try{ await navigator.clipboard.writeText(url); toast('已複製，傳給對方即可'); }catch{ prompt('請複製這個連結：',url); }
  };
}

// ===================== 彈出視窗 =====================
function modal(html,onMount){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`; document.body.appendChild(bg);
  const close=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg) close(); };
  onMount(bg,close);
}
function wdOptions(sel){ return [1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${d===sel?'selected':''}>週${WD[d]}</option>`).join(''); }

function openNameModal(first){
  modal(`<h3>${first?'歡迎！先設定你的名字':'修改顯示名稱'}</h3><p class="hint">對方會看到這個名字</p>
    <input id="nmI" type="text" maxlength="12" value="${esc(nameOf(me.id))}">
    <div class="actions"><button class="btn" id="nmS">儲存</button></div>`,(el,close)=>{
    el.querySelector('#nmS').onclick=async()=>{ const name=el.querySelector('#nmI').value.trim(); if(!name) return toast('請輸入名字');
      const {error}=await sb.from('profiles').upsert({id:me.id,name}); if(error) return toast('儲存失敗');
      await loadProfiles(); close(); render(); toast('已儲存'); };
  });
}

function openColorModal(){
  let cur=prof(me.id)?.color||'';
  const other=people().filter(u=>u!==me.id).map(u=>colorOf(u));
  modal(`<h3>選擇我的代表色</h3><p class="hint">兩個人用不同顏色，看起來比較清楚${other.length?`（對方目前是 <span class="swatch-cur" style="background:${other[0]};vertical-align:middle"></span>）`:''}</p>
    <div class="swatches">${SWATCHES.map(c=>`<button class="sw ${c===cur?'sel':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>
    <label class="f">或自訂顏色</label><input id="cc" type="color" value="${cur||'#2f9e8f'}" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:4px">
    <div class="actions"><button class="btn ghost" id="cR">恢復預設</button><button class="btn" id="cOk">儲存</button></div>`,(el,close)=>{
    const sel=c=>{ cur=c; el.querySelectorAll('.sw').forEach(b=>b.classList.toggle('sel',b.dataset.c===c)); el.querySelector('#cc').value=c; };
    el.querySelectorAll('.sw').forEach(b=>b.onclick=()=>sel(b.dataset.c));
    el.querySelector('#cc').oninput=e=>{ cur=e.target.value; el.querySelectorAll('.sw').forEach(b=>b.classList.remove('sel')); };
    const save=async(c)=>{ const {error}=await sb.from('profiles').update({color:c}).eq('id',me.id); if(error) return toast('儲存失敗');
      await loadProfiles(); close(); render(); toast('已儲存'); };
    el.querySelector('#cOk').onclick=()=>save(cur||null);
    el.querySelector('#cR').onclick=()=>save(null);
  });
}

// p=null：個人預設切點；p=專案：該專案的個人切點
function openCutModal(p){
  const ov=p?projOverride(me.id,p.id):null, cur=p?projCut(me.id,p.id):userCut(me.id);
  modal(`<h3>${p?`「${esc(p.name)}」的切點`:'我的預設切點'}</h3>
    <p class="hint">${p?'只影響你自己在這個專案的每日／每週／每月時數計算。':'影響首頁今日／本週時數、紀錄頁的期間，以及沒有另外設定的專案。'}</p>
    ${p?`<div class="seg"><label><input type="radio" name="mode" value="def" ${ov?'':'checked'}> 跟隨我的預設<span class="hint" style="display:block;margin:0">${cutText(userCut(me.id))}</span></label>
      <label><input type="radio" name="mode" value="own" ${ov?'checked':''}> 本專案自訂</label></div>`:''}
    <div id="cutF" class="${p&&!ov?'hidden':''}">
      <label class="f">每天從幾點開始算</label><input id="cM" type="time" value="${minToHM(cur.m)}">
      <label class="f">每週從星期幾開始</label><select id="cW">${wdOptions(cur.wd)}</select>
    </div>
    <p class="hint">改了之後，過去的紀錄也會依新的切點重新歸到對應的日／週／月（原始打卡時間不變）。</p>
    <div class="actions"><button class="btn" id="cS">儲存</button></div>`,(el,close)=>{
    const F=el.querySelector('#cutF');
    el.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>F.classList.toggle('hidden',r.value==='def'&&r.checked));
    el.querySelector('#cS').onclick=async()=>{
      const m=hmToMin(el.querySelector('#cM').value), wd=+el.querySelector('#cW').value; let error;
      if(!p){ ({error}=await sb.from('profiles').update({day_start_min:m,week_start_day:wd}).eq('id',me.id)); }
      else if(el.querySelector('input[name=mode]:checked').value==='def'){ ({error}=await sb.from('project_user_settings').delete().eq('project_id',p.id).eq('user_id',me.id)); }
      else { ({error}=await sb.from('project_user_settings').upsert({project_id:p.id,user_id:me.id,day_start_min:m,week_start_day:wd})); }
      if(error) return toast('儲存失敗');
      await Promise.all([loadProfiles(),loadPus()]); close(); render(); toast('已儲存');
    };
  });
}

function openSessionModal(s){
  const isNew=!s, now=new Date();
  const proj=s?s.project_id:(localStorage.getItem(LAST_PROJ_KEY)||'');
  const projOpts=st.projects.filter(p=>!p.archived||p.id===proj).map(p=>`<option value="${p.id}" ${p.id===proj?'selected':''}>${esc(p.name)}</option>`).join('')+`<option value="" ${!proj?'selected':''}>未指定專案</option>`;
  const isOpen=s && !s.end_at;
  modal(`<h3>${isNew?'補登打卡':'修改打卡'}</h3>
    <label class="f">專案</label><select id="sP">${projOpts}</select>
    <div id="sTw"><label class="f">任務（選填）</label><select id="sT">${taskOptions(proj,s?.task_id||'')}</select></div>
    <label class="f">開始時間</label><input id="sA" type="datetime-local" step="1" value="${toInput(s?s.start_at:new Date(now-3600000))}">
    <label class="f">結束時間${isOpen?'（留空＝仍在工作中）':''}</label><input id="sB" type="datetime-local" step="1" value="${s&&s.end_at?toInput(s.end_at):(isOpen?'':toInput(now))}">
    <div class="hint" id="sD"></div>
    <label class="f">備註（選填）</label><input id="sN" type="text" maxlength="60" value="${esc(s?.note||'')}">
    <div class="actions">${isNew?'':'<button class="btn danger-ghost" id="sDel">刪除</button>'}<button class="btn" id="sS">儲存</button></div>`,(el,close)=>{
    const A=el.querySelector('#sA'),B=el.querySelector('#sB'),D=el.querySelector('#sD'),P=el.querySelector('#sP'),T=el.querySelector('#sT'),Tw=el.querySelector('#sTw');
    const tv=()=>Tw.classList.toggle('hidden',!P.value || !st.tasks.some(t=>t.project_id===P.value)); tv();
    P.onchange=()=>{ T.innerHTML=taskOptions(P.value,''); tv(); };
    const upd=()=>{ if(A.value&&B.value){ const ms=new Date(B.value)-new Date(A.value); D.textContent=ms>=0?`共 ${zhDur(ms)}`:'⚠ 結束時間早於開始時間'; } else D.textContent=''; };
    A.oninput=B.oninput=upd; upd();
    el.querySelector('#sS').onclick=async()=>{
      if(!A.value) return toast('請填開始時間');
      if(!B.value && !isOpen) return toast('請填結束時間');
      const a=new Date(A.value), b=B.value?new Date(B.value):null;
      if(b && b<a) return toast('結束時間不能早於開始時間');
      if(a>new Date() || (b && b>new Date(Date.now()+60000))) return toast('不能登記未來的時間');
      const row={project_id:P.value||null,task_id:P.value?(T.value||null):null,start_at:a.toISOString(),end_at:b?b.toISOString():null,note:el.querySelector('#sN').value.trim()||null};
      const overlap=st.sessions.some(x=>x.user_id===me.id && (!s||x.id!==s.id) && +new Date(x.start_at)<+(b||new Date()) && sessEnd(x)>+a);
      if(overlap && !confirm('這段時間和你其他的打卡紀錄重疊，仍要儲存嗎？')) return;
      const {error}=isNew?await sb.from('sessions').insert({...row,user_id:me.id}):await sb.from('sessions').update(row).eq('id',s.id);
      if(error) return toast(String(error.message).includes('one_open')?'你已經有一筆進行中的打卡':'儲存失敗');
      await loadSessions(); close(); render(); toast('已儲存');
    };
    const del=el.querySelector('#sDel');
    if(del) del.onclick=async()=>{ if(!confirm('確定刪除這筆紀錄？')) return;
      const {error}=await sb.from('sessions').delete().eq('id',s.id); if(error) return toast('刪除失敗');
      await loadSessions(); close(); render(); toast('已刪除'); };
  });
}

function openTaskModal(t){
  modal(`<h3>編輯任務</h3>
    <label class="f">任務名稱</label><input id="tN" type="text" maxlength="60" value="${esc(t.title)}">
    <label class="f">負責人</label><select id="tA"><option value="">未指派</option>${people().map(u=>`<option value="${u}" ${t.assignee===u?'selected':''}>${esc(nameOf(u))}</option>`).join('')}</select>
    <label class="f">到期日（選填）</label><input id="tD" type="date" value="${t.due||''}">
    <div class="goal-set" style="margin-top:14px"><input type="checkbox" id="tX" ${t.done?'checked':''}><span>已完成</span></div>
    <div class="actions"><button class="btn danger-ghost" id="tDel">刪除</button><button class="btn" id="tS">儲存</button></div>`,(el,close)=>{
    el.querySelector('#tS').onclick=async()=>{ const title=el.querySelector('#tN').value.trim(); if(!title) return toast('請輸入任務名稱');
      const {error}=await sb.from('tasks').update({title,assignee:el.querySelector('#tA').value||null,due:el.querySelector('#tD').value||null,done:el.querySelector('#tX').checked}).eq('id',t.id);
      if(error) return toast('儲存失敗'); await loadTasks(); close(); render(); toast('已儲存'); };
    el.querySelector('#tDel').onclick=async()=>{ if(!confirm(`確定刪除任務「${t.title}」？\n（相關打卡紀錄會保留，只是不再標示任務）`)) return;
      const {error}=await sb.from('tasks').delete().eq('id',t.id); if(error) return toast('刪除失敗');
      await Promise.all([loadTasks(),loadSessions()]); close(); render(); toast('已刪除'); };
  });
}

function openProjectModal(p){
  const isNew=!p;
  modal(`<h3>${isNew?'新增專案':'編輯專案'}</h3>
    <label class="f">專案名稱</label><input id="pN" type="text" maxlength="30" value="${esc(p?.name||'')}" placeholder="例如：A 專案">
    <label class="f">專案死限（選填）</label><input id="pD" type="date" value="${p?.deadline||''}">
    <label class="f">每人時數目標（可勾選一種或多種）</label>
    ${KINDS.map(([f,,,l])=>`<div class="goal-set"><input type="checkbox" id="c_${f}" ${p&&p[f]>0?'checked':''}><span class="lbl">${l}</span>
      <input type="number" id="v_${f}" min="0" step="0.5" inputmode="decimal" placeholder="小時" value="${p&&p[f]>0?+p[f]:''}"></div>`).join('')}
    ${isNew?'':`<div class="goal-set" style="margin-top:16px"><input type="checkbox" id="pArc" ${p.archived?'checked':''}><span>封存（不再出現在打卡選單）</span></div>`}
    <div class="actions">${isNew?'':'<button class="btn danger-ghost" id="pDel">刪除</button>'}<button class="btn" id="pS">儲存</button></div>`,(el,close)=>{
    KINDS.forEach(([f])=>{ const c=el.querySelector('#c_'+f), v=el.querySelector('#v_'+f);
      v.oninput=()=>{ c.checked=+v.value>0; }; c.onchange=()=>{ if(c.checked) v.focus(); }; });
    el.querySelector('#pS').onclick=async()=>{
      const name=el.querySelector('#pN').value.trim(); if(!name) return toast('請輸入專案名稱');
      const row={name,deadline:el.querySelector('#pD').value||null};
      for(const [f,,,l] of KINDS){ const on=el.querySelector('#c_'+f).checked, v=+el.querySelector('#v_'+f).value;
        if(on && !(v>0)) return toast(`請填入${l}目標時數`); row[f]=on?v:null; }
      if(!isNew) row.archived=el.querySelector('#pArc').checked;
      const {error}=isNew?await sb.from('projects').insert(row):await sb.from('projects').update(row).eq('id',p.id);
      if(error) return toast('儲存失敗');
      await loadProjects(); close(); render(); toast('已儲存');
    };
    const del=el.querySelector('#pDel');
    if(del) del.onclick=async()=>{ if(!confirm(`確定刪除「${p.name}」？\n（打卡紀錄會保留但變成「未指定專案」，子任務會一併刪除。若只是不再使用，建議改用封存）`)) return;
      const {error}=await sb.from('projects').delete().eq('id',p.id); if(error) return toast('刪除失敗');
      st.projView=null; await loadAll(); close(); render(); toast('已刪除'); };
  });
}

// ===================== PWA =====================
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
boot();
</script>
